apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper-shared
  namespace: tas-shared
  labels:
    app: zookeeper-shared
    component: messaging
spec:
  serviceName: zookeeper-shared-service
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper-shared
  template:
    metadata:
      labels:
        app: zookeeper-shared
        component: messaging
    spec:
      containers:
      - name: zookeeper
        image: confluentinc/cp-zookeeper:7.5.0
        ports:
        - containerPort: 2181
          name: client
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
        - name: KAFKA_OPTS
          value: "-Dzookeeper.4lw.commands.whitelist=mntr,ruok,stat,srvr"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: zookeeper-data
          mountPath: /var/lib/zookeeper/data
        - name: zookeeper-logs
          mountPath: /var/lib/zookeeper/log
  volumeClaimTemplates:
  - metadata:
      name: zookeeper-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
  - metadata:
      name: zookeeper-logs
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-shared
  namespace: tas-shared
  labels:
    app: zookeeper-shared
spec:
  type: ClusterIP
  ports:
  - port: 2181
    targetPort: 2181
    protocol: TCP
    name: client
  selector:
    app: zookeeper-shared

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-shared
  namespace: tas-shared
  labels:
    app: kafka-shared
    component: messaging
spec:
  serviceName: kafka-shared
  replicas: 1
  selector:
    matchLabels:
      app: kafka-shared
  template:
    metadata:
      labels:
        app: kafka-shared
        component: messaging
    spec:
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.5.0
        ports:
        - containerPort: 9092
          name: kafka
        env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "zookeeper-shared:2181"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://kafka-shared-0.kafka-shared.tas-shared.svc.cluster.local:9092"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "PLAINTEXT:PLAINTEXT"
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: "PLAINTEXT"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          # Disabled 2026-05-07: a typo like tas.activty.documents would
          # silently create a 1-partition topic and drop messages. Topics
          # are managed declaratively via kafka-topics-job.yaml; produce
          # calls now fail loudly on unknown topic.
          value: "false"
        # Guaranteed QoS (requests == limits), per CLAUDE.md: Kafka is named
        # in the policy's own stateful/critical-infrastructure exception list,
        # alongside PostgreSQL, Neo4j, Keycloak and Loki.
        #
        # Measured 2026-09-22 (Phase 1 of MEMORY-RIGHTSIZING-PLAN.md): this
        # broker's working set is 1,140Mi against a 1Gi request — it uses MORE
        # than it reserves, which is the half of the right-sizing problem that
        # causes outages rather than waste. Burstable and over its request, it
        # was a candidate for eviction under node pressure despite being the
        # only broker in the cluster.
        #
        # The ceiling is NOT being raised: limits are unchanged at 2Gi/1000m.
        # Only the requests move up to meet them, so this changes scheduling
        # accounting and eviction order, not what the JVM may consume. That
        # matters because the image pins the heap: no KAFKA_HEAP_OPTS is set,
        # so cp-kafka 7.5.0 runs its default -Xmx1G — and 1,140Mi is exactly
        # 1G of heap plus ~140Mi of JVM and native overhead. Memory here is
        # bounded by the heap setting, not by traffic, so a 2Gi ceiling has
        # ~1.75x headroom over anything observed.
        #
        # BOTH cpu and memory must be equal for Guaranteed — one unequal
        # resource in one container silently demotes the pod to Burstable.
        #
        # Re-profile after 2026-09-29, when a 7d p95 exists (cAdvisor scraping
        # began 2026-09-22, Phase 0):
        #   quantile_over_time(0.95, container_memory_working_set_bytes{
        #     namespace="tas-shared",pod="kafka-shared-0",container="kafka"}[7d])
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: kafka-data
          mountPath: /var/lib/kafka/data
        livenessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
  volumeClaimTemplates:
  - metadata:
      name: kafka-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 20Gi

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-shared
  namespace: tas-shared
  labels:
    app: kafka-shared
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  ports:
  - port: 9092
    targetPort: 9092
    protocol: TCP
    name: kafka
  selector:
    app: kafka-shared