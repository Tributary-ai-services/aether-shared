---
# Credentials for the backup CronJob (OPS-1).
#
# Copy to a file OUTSIDE this repository, fill in the blanks, and apply:
#
#   cp 10-secret.example.yaml /tmp/tas-backup-credentials.yaml
#   $EDITOR /tmp/tas-backup-credentials.yaml
#   kubectl apply -f /tmp/tas-backup-credentials.yaml
#   shred -u /tmp/tas-backup-credentials.yaml
#
# Never commit the filled-in version. Source-database passwords are read from
# the secrets that already exist in tas-shared (postgres-shared-secret,
# keycloak-db-shared-secret, timescaledb-shared-secret); only Neo4j and the two
# offsite targets need anything here.
apiVersion: v1
kind: Secret
metadata:
  name: tas-backup-credentials
  namespace: tas-shared
  labels:
    project: tas
    tier: shared-infrastructure
    component: backup
type: Opaque
stringData:
  # --- Neo4j ------------------------------------------------------------
  # Neo4j has no Secret of its own: aether-be's StatefulSet carries
  # NEO4J_AUTH=neo4j/password as a literal env value. That is tracked
  # separately as SEC-19; this backup job does not make it worse, but it does
  # need the same credential.
  neo4j-user: "neo4j"
  neo4j-password: ""

  # --- Cloudflare R2 (primary offsite) ----------------------------------
  # Create at: Cloudflare dashboard > R2 > Manage API tokens > Create token,
  # scoped "Object Read & Write" and restricted to the backup bucket.
  # The endpoint is https://<ACCOUNT_ID>.r2.cloudflarestorage.com
  r2-access-key-id: ""
  r2-secret-access-key: ""
  r2-endpoint: ""
  r2-bucket: "tas-backups"

  # --- Backblaze B2 (break-glass copy, databases only) ------------------
  # Deliberately a different vendor from Cloudflare, which already fronts
  # production via the airops-edge tunnel. If that account is ever lost, this
  # copy is the one that survives. Create at: B2 > Application Keys.
  b2-account-id: ""
  b2-application-key: ""
  b2-bucket: "tas-backups"
