---
# Nightly backup of every stateful TAS data store (OPS-1).
#
# SHAPE: the three dump steps run as initContainers, which Kubernetes runs in
# order and which abort the pod on first failure. That gives a consistent set
# for free -- all four dumps come from roughly the same moment, and a partial
# set can never be promoted. The final container seals, mirrors and ships it.
#
# Images are chosen to already be resident on this node: postgres:15-alpine and
# neo4j:5.15-community are what the servers themselves run. rclone is pulled
# from Docker Hub and pinned -- see OPS-14 on floating tags.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tas-backup
  namespace: tas-shared
  labels:
    project: tas
    tier: shared-infrastructure
    component: backup
spec:
  # 03:30 UTC daily. Deliberately clear of agent-builder-model-migration,
  # which holds 04:00 Monday.
  schedule: "30 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 14
  # If the node is down at 03:30, run late rather than skip silently.
  startingDeadlineSeconds: 7200
  jobTemplate:
    spec:
      backoffLimit: 2
      # A run that hangs must not block tomorrow's (concurrencyPolicy: Forbid).
      activeDeadlineSeconds: 5400
      template:
        metadata:
          labels:
            app: tas-backup
            component: backup
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: false
            fsGroup: 0
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: tas-backups
            - name: scripts
              configMap:
                name: tas-backup-scripts
                defaultMode: 0755
            # Carries the run timestamp from the first container to the rest,
            # so all four dumps land in one directory.
            - name: run
              emptyDir: {}

          initContainers:
            - name: dump-databases
              image: postgres:15-alpine
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/dump-databases.sh"]
              env:
                - name: BACKUP_ROOT
                  value: /backup
                - name: PGSHARED_USER
                  valueFrom:
                    secretKeyRef: { name: postgres-shared-secret, key: username }
                - name: PGSHARED_PASSWORD
                  valueFrom:
                    secretKeyRef: { name: postgres-shared-secret, key: password }
                - name: KEYCLOAK_PASSWORD
                  valueFrom:
                    secretKeyRef: { name: keycloak-db-shared-secret, key: password }
                - name: TIMESCALE_USER
                  valueFrom:
                    secretKeyRef: { name: timescaledb-shared-secret, key: username }
                - name: TIMESCALE_PASSWORD
                  valueFrom:
                    secretKeyRef: { name: timescaledb-shared-secret, key: password }
              volumeMounts:
                - { name: backups, mountPath: /backup }
                - { name: scripts, mountPath: /scripts }
                - { name: run,     mountPath: /run/backup }

            - name: dump-neo4j
              image: neo4j:5.15-community
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/dump-neo4j.sh"]
              env:
                - name: BACKUP_ROOT
                  value: /backup
                - name: NEO4J_HOST
                  value: neo4j.aether-be.svc.cluster.local
                - name: NEO4J_USER
                  valueFrom:
                    secretKeyRef: { name: tas-backup-credentials, key: neo4j-user }
                - name: NEO4J_PASSWORD
                  valueFrom:
                    secretKeyRef: { name: tas-backup-credentials, key: neo4j-password }
              volumeMounts:
                - { name: backups, mountPath: /backup }
                - { name: scripts, mountPath: /scripts }
                - { name: run,     mountPath: /run/backup }

          containers:
            - name: finalize
              image: rclone/rclone:1.68
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/finalize.sh"]
              env:
                - name: BACKUP_ROOT
                  value: /backup
                - name: CLUSTER_NAME
                  value: um773dev (k3s, single node)
                - name: NEO4J_HOST
                  value: neo4j.aether-be.svc.cluster.local

                # --- retention -------------------------------------------
                - { name: KEEP_LOCAL_DB,          value: "14" }
                - { name: KEEP_LOCAL_SUPERSEDED,  value: "30" }
                - { name: KEEP_R2_DB,             value: "30" }
                - { name: KEEP_B2_DB,             value: "90" }

                # Flip to "true" once both offsite targets are configured, so
                # that losing them becomes a red job instead of a quiet warning.
                - { name: OFFSITE_REQUIRED,       value: "false" }

                # --- observability (OPS-21) ------------------------------
                # The pod exits before anything could scrape it, so finalize.sh
                # publishes the run's outcome here and Prometheus alerts when
                # that timestamp goes stale. Unset = no publishing, and the
                # backup still runs: monitoring must never be able to fail a
                # good backup. But then nothing is watching, which is the whole
                # problem OPS-21 exists to fix.
                - { name: PUSHGATEWAY_URL, value: "http://pushgateway-shared.tas-shared.svc.cluster.local:9091" }

                # --- source: MinIO ---------------------------------------
                - { name: RCLONE_CONFIG_MINIOSRC_TYPE,     value: s3 }
                - { name: RCLONE_CONFIG_MINIOSRC_PROVIDER, value: Minio }
                - { name: RCLONE_CONFIG_MINIOSRC_ENDPOINT, value: "http://minio-shared:9000" }
                - { name: RCLONE_CONFIG_MINIOSRC_REGION,   value: us-east-1 }
                - name: RCLONE_CONFIG_MINIOSRC_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: { name: minio-shared-secret, key: root-user }
                - name: RCLONE_CONFIG_MINIOSRC_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: { name: minio-shared-secret, key: root-password }

                # --- offsite: Cloudflare R2 ------------------------------
                - { name: RCLONE_CONFIG_R2_TYPE,     value: s3 }
                - { name: RCLONE_CONFIG_R2_PROVIDER, value: Cloudflare }
                - { name: RCLONE_CONFIG_R2_REGION,   value: auto }
                # The R2 token is scoped to one bucket, so it may not call
                # CreateBucket -- which rclone attempts before its first upload
                # unless told the bucket exists. Verified 2026-09-17: 403
                # AccessDenied on CreateBucket without this, clean write with it.
                - { name: RCLONE_CONFIG_R2_NO_CHECK_BUCKET, value: "true" }
                - name: RCLONE_CONFIG_R2_ENDPOINT
                  valueFrom:
                    secretKeyRef: { name: tas-backup-credentials, key: r2-endpoint }
                - name: RCLONE_CONFIG_R2_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: { name: tas-backup-credentials, key: r2-access-key-id }
                - name: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: { name: tas-backup-credentials, key: r2-secret-access-key }
                - name: R2_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: { name: tas-backup-credentials, key: r2-access-key-id }
                - name: R2_BUCKET
                  valueFrom:
                    secretKeyRef: { name: tas-backup-credentials, key: r2-bucket }

                # --- offsite: Backblaze B2 -------------------------------
                - { name: RCLONE_CONFIG_B2_TYPE, value: b2 }
                # B2 keeps every file version forever by default, so an ordinary
                # delete only HIDES the old set -- it keeps counting toward the
                # 10 GB free tier and retention silently stops working. Pair
                # this with a "keep only the last version" lifecycle rule.
                - { name: RCLONE_CONFIG_B2_HARD_DELETE, value: "true" }
                - name: RCLONE_CONFIG_B2_ACCOUNT
                  valueFrom:
                    secretKeyRef: { name: tas-backup-credentials, key: b2-account-id }
                - name: RCLONE_CONFIG_B2_KEY
                  valueFrom:
                    secretKeyRef: { name: tas-backup-credentials, key: b2-application-key }
                - name: B2_ACCOUNT_ID
                  valueFrom:
                    secretKeyRef: { name: tas-backup-credentials, key: b2-account-id }
                - name: B2_BUCKET
                  valueFrom:
                    secretKeyRef: { name: tas-backup-credentials, key: b2-bucket }

                # --- client-side encryption for everything offsite ---------
                # finalize.sh refuses to upload if offsite credentials exist but
                # these do not. optional: true so a cluster with no offsite at
                # all still starts the pod.
                - name: CRYPT_PASSWORD
                  valueFrom:
                    secretKeyRef: { name: tas-backup-credentials, key: crypt-password, optional: true }
                - name: CRYPT_SALT
                  valueFrom:
                    secretKeyRef: { name: tas-backup-credentials, key: crypt-salt, optional: true }
              volumeMounts:
                - { name: backups, mountPath: /backup }
                - { name: scripts, mountPath: /scripts }
                - { name: run,     mountPath: /run/backup }
