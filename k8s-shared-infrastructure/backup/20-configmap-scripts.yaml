---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tas-backup-scripts
  namespace: tas-shared
  labels:
    project: tas
    tier: shared-infrastructure
    component: backup
data:
  dump-databases.sh: |
    #!/bin/sh
    # Dumps the three PostgreSQL-family databases into the staging directory.
    #
    # Runs in postgres:15-alpine because all three servers are PostgreSQL 15 and
    # pg_dump refuses to dump from a server newer than the client.
    set -eu

    # This is the first container in the pod, so it mints the timestamp that
    # every later step reuses -- that is what makes the four dumps one set
    # rather than four unrelated files.
    mkdir -p /run/backup
    date -u +%Y%m%dT%H%M%SZ > /run/backup/TS
    BACKUP_TS="$(cat /run/backup/TS)"
    echo "==> backup timestamp ${BACKUP_TS}"

    DEST="${BACKUP_ROOT}/db/.in-progress/${BACKUP_TS}"
    mkdir -p "$DEST"

    # A truncated or empty dump has to fail the run HERE. TAS has already
    # shipped a 0-byte "backup" once -- aether-be/backups/neo4j_backup_20250810
    # is zero bytes -- and the reason OPS-1 stayed open is that nobody noticed.
    # Every dump is checked for the marker its tool writes on clean completion.
    verify() {
      file="$1"
      marker="$2"
      if [ ! -s "$file" ]; then
        echo "FATAL: $file is empty" >&2
        exit 1
      fi
      if ! tail -5 "$file" | grep -qF "$marker"; then
        echo "FATAL: $file has no completion marker ('$marker') -- dump truncated" >&2
        exit 1
      fi
      echo "  ok $(basename "$file") -- $(wc -c < "$file") bytes"
    }

    echo "==> postgres-shared (pg_dumpall: every database plus roles)"
    PGPASSWORD="$PGSHARED_PASSWORD" pg_dumpall \
      --host=postgres-shared --username="$PGSHARED_USER" \
      > "$DEST/postgres-shared.sql"
    verify "$DEST/postgres-shared.sql" "PostgreSQL database cluster dump complete"

    echo "==> keycloak-db-shared (pg_dumpall: the aether realm lives in here)"
    PGPASSWORD="$KEYCLOAK_PASSWORD" pg_dumpall \
      --host=keycloak-db-shared --username=keycloak \
      > "$DEST/keycloak-db.sql"
    verify "$DEST/keycloak-db.sql" "PostgreSQL database cluster dump complete"

    echo "==> timescaledb-shared (pg_dump: tas_events)"
    # pg_dump emits circular-foreign-key warnings for the TimescaleDB catalog
    # tables (hypertable, chunk, continuous_agg). They are expected and are
    # exactly why RESTORE.md insists on timescaledb_pre_restore(). Leave them
    # on stderr where an operator reading the job log will see them.
    PGPASSWORD="$TIMESCALE_PASSWORD" pg_dump \
      --host=timescaledb-shared --username="$TIMESCALE_USER" \
      --dbname=tas_events --format=plain \
      > "$DEST/timescaledb-tas_events.sql"
    verify "$DEST/timescaledb-tas_events.sql" "PostgreSQL database dump complete"

    gzip -9 "$DEST"/*.sql
    echo "==> databases complete"

  dump-neo4j.sh: |
    #!/bin/sh
    # Logical export of the Neo4j graph into the staging directory.
    set -eu

    BACKUP_TS="$(cat /run/backup/TS)"

    DEST="${BACKUP_ROOT}/db/.in-progress/${BACKUP_TS}"
    mkdir -p "$DEST"
    RAW="$DEST/.neo4j.b64"

    # Neo4j 5.15 COMMUNITY has no online backup: `neo4j-admin database dump`
    # requires the database to be stopped, and `neo4j-admin database backup` is
    # Enterprise-only. So this is a logical APOC export, which does also carry
    # indexes and constraints (verified 2026-09-14 -- the output opens with the
    # CREATE RANGE INDEX statements).
    #
    # The payload is base64-encoded server-side on purpose. cypher-shell's
    # --format plain escapes embedded quotes as \" while leaving backslashes
    # untouched, which is ambiguous to invert on values that themselves contain
    # escaped JSON -- and several Workflow.output properties in this graph do.
    # Base64 contains no character that plain format will rewrite, so the only
    # unwrapping needed is stripping the two surrounding quotes.
    echo "==> neo4j (APOC cypher export, base64-framed)"
    cypher-shell \
      --address "bolt://${NEO4J_HOST}:7687" \
      --username "$NEO4J_USER" \
      --password "$NEO4J_PASSWORD" \
      --format plain \
      'CALL apoc.export.cypher.all(null,{stream:true,format:"cypher-shell"}) YIELD cypherStatements RETURN apoc.text.base64Encode(cypherStatements) AS b64;' \
      > "$RAW"

    # Line 1 is the "b64" column header; line 2 is the single quoted value.
    tail -n +2 "$RAW" | sed 's/^"//; s/"$//' | tr -d '\n' | base64 -d > "$DEST/neo4j.cypher"
    rm -f "$RAW"

    if [ ! -s "$DEST/neo4j.cypher" ]; then
      echo "FATAL: neo4j export is empty" >&2
      exit 1
    fi
    if ! head -1 "$DEST/neo4j.cypher" | grep -qx ':begin'; then
      echo "FATAL: neo4j export does not start with ':begin' -- not a cypher-shell script" >&2
      exit 1
    fi
    if ! tail -1 "$DEST/neo4j.cypher" | grep -qx ':commit'; then
      echo "FATAL: neo4j export does not end with ':commit' -- truncated" >&2
      exit 1
    fi

    echo "  ok neo4j.cypher -- $(wc -c < "$DEST/neo4j.cypher") bytes"
    gzip -9 "$DEST/neo4j.cypher"
    echo "==> neo4j complete"

  publish-metrics.sh: |
    #!/bin/sh
    # Publishes tas-backup's outcome to Pushgateway (OPS-21). Sourced by
    # finalize.sh; also sourced by reseed-metrics.sh to re-publish without
    # running a backup.
    #
    # THE PVC IS THE SOURCE OF TRUTH, not the gateway. Every publish recomputes
    # every gauge from LATEST and the marker files, so re-seeding after a
    # pushgateway restart is just "run this again" and a failed run reports its
    # failure without disturbing the last good timestamp.
    #
    # Pushgateway POST semantics, measured here 2026-09-18 and worth knowing:
    # POST replaces only the metric FAMILIES present in the body and leaves the
    # rest of the group untouched -- it is PUT that replaces a whole group, and
    # busybox wget can send neither PUT nor DELETE. So a family that stops being
    # published does not disappear; it freezes at its last value and quietly
    # goes stale. That is why every gauge here is published unconditionally,
    # including a zero, rather than being omitted when it does not apply.
    #
    # Requires: BACKUP_ROOT, PUSHGATEWAY_URL (unset = publish nothing).
    FAILURE_MARK="${BACKUP_ROOT}/.last-failure"
    OFFSITE_MARK_PREFIX="${BACKUP_ROOT}/.offsite-"

    ts_epoch() {
      # Backup timestamps are YYYYmmddTHHMMSSZ, which busybox date parses with -D.
      date -u -D "%Y%m%dT%H%M%SZ" -d "$1" +%s 2>/dev/null || echo ""
    }

    publish_metrics() {
      [ -n "${PUSHGATEWAY_URL:-}" ] || return 0

      _body=/tmp/tas-backup-metrics.prom
      : > "$_body"

      # Last SUCCESS is read from LATEST, which is written only after a set has
      # been sealed, promoted, mirrored and (when configured) verified offsite.
      if [ -f "${BACKUP_ROOT}/db/LATEST" ]; then
        _latest="$(cat "${BACKUP_ROOT}/db/LATEST")"
        _ok="$(ts_epoch "$_latest")"
        if [ -n "$_ok" ]; then
          echo "# HELP tas_backup_last_success_timestamp_seconds Unix time of the last completed tas-backup run." >> "$_body"
          echo "# TYPE tas_backup_last_success_timestamp_seconds gauge" >> "$_body"
          echo "tas_backup_last_success_timestamp_seconds ${_ok}" >> "$_body"
        fi
      fi

      # Published even when there has been no failure (as 0), so that a run
      # which recovers actively overwrites the old value instead of leaving a
      # stale one behind for TASBackupRunFailed to keep firing on.
      if [ -f "$FAILURE_MARK" ]; then
        _failed="$(cat "$FAILURE_MARK")"
      else
        _failed=0
      fi
      echo "# HELP tas_backup_last_failure_timestamp_seconds Unix time of the last tas-backup run that failed after the dump stage; 0 if none." >> "$_body"
      echo "# TYPE tas_backup_last_failure_timestamp_seconds gauge" >> "$_body"
      echo "tas_backup_last_failure_timestamp_seconds ${_failed}" >> "$_body"

      for _m in "${OFFSITE_MARK_PREFIX}"*; do
        [ -f "$_m" ] || continue
        _target="${_m##*/.offsite-}"
        echo "# TYPE tas_backup_offsite_last_success_timestamp_seconds gauge" >> "$_body"
        echo "tas_backup_offsite_last_success_timestamp_seconds{target=\"${_target}\"} $(cat "$_m")" >> "$_body"
      done

      _points="$( (cd "${BACKUP_ROOT}/db" 2>/dev/null && ls -1d 2*/ 2>/dev/null | wc -l) || echo 0 )"
      echo "# HELP tas_backup_local_restore_points Number of complete restore points held locally." >> "$_body"
      echo "# TYPE tas_backup_local_restore_points gauge" >> "$_body"
      echo "tas_backup_local_restore_points ${_points}" >> "$_body"

      _free="$(df -kP "${BACKUP_ROOT}" 2>/dev/null | awk 'NR==2 {print $4 * 1024}')"
      if [ -n "$_free" ]; then
        echo "# HELP tas_backup_local_free_bytes Free space on the backup volume." >> "$_body"
        echo "# TYPE tas_backup_local_free_bytes gauge" >> "$_body"
        echo "tas_backup_local_free_bytes ${_free}" >> "$_body"
      fi

      # A monitoring failure must never fail a good backup, so this is
      # best-effort and loud rather than fatal.
      if wget -q -T 15 -O /dev/null --post-file="$_body" \
           "${PUSHGATEWAY_URL}/metrics/job/tas_backup"; then
        echo "==> published backup metrics to pushgateway"
      else
        echo "!! could not publish backup metrics to ${PUSHGATEWAY_URL} -- the" >&2
        echo "   backup itself is unaffected, but staleness alerting is blind" >&2
      fi
    }

  reseed-metrics.sh: |
    #!/bin/sh
    # Re-publishes the current backup state to Pushgateway without running a
    # backup (OPS-21). Use this after pushgateway-shared loses its persistence
    # file, when TASBackupMetricMissing fires but backups are in fact fine:
    #
    #   kubectl delete job tas-backup-reseed-metrics -n tas-shared --ignore-not-found
    #   kubectl apply -f 40-job-reseed-metrics.yaml
    #
    # (A Job rather than "kubectl create job --from=cronjob/tas-backup", which
    # cannot override the command and would run a whole backup instead.)
    #
    # Reads only LATEST and the marker files, so it cannot invent a restore
    # point that does not exist on disk.
    set -eu
    . /scripts/publish-metrics.sh
    if [ -z "${PUSHGATEWAY_URL:-}" ]; then
      echo "FATAL: PUSHGATEWAY_URL is not set -- nothing to publish to" >&2
      exit 1
    fi
    publish_metrics
    echo "==> re-seeded from ${BACKUP_ROOT}"

  finalize.sh: |
    #!/bin/sh
    # Seals the staged database dumps, mirrors MinIO, pushes both offsite, and
    # applies retention. Runs last; the two dump scripts run as initContainers
    # before it, so reaching this script at all means every dump succeeded.
    set -eu

    BACKUP_TS="$(cat /run/backup/TS)"

    STAGE="${BACKUP_ROOT}/db/.in-progress/${BACKUP_TS}"
    FINAL="${BACKUP_ROOT}/db/${BACKUP_TS}"

    # ----------------------------------------------------------- observability
    # OPS-21. A CronJob pod cannot be scraped -- by the time Prometheus came
    # looking it would be long gone -- so the run publishes its own outcome to
    # pushgateway-shared and Prometheus alerts on that timestamp going stale.
    # Until this existed, a backup that simply stopped running produced no
    # error, no failed pod and no log line anyone read: silence was
    # indistinguishable from success.
    #
    # The helpers live in their own file because re-seeding the gateway after a
    # restart must not require running a backup -- see reseed-metrics.sh.
    . /scripts/publish-metrics.sh

    on_exit() {
      _rc=$?
      if [ "$_rc" -ne 0 ]; then
        date +%s > "$FAILURE_MARK" 2>/dev/null || true
        publish_metrics || true
      fi
      exit "$_rc"
    }
    trap on_exit EXIT

    if [ ! -d "$STAGE" ]; then
      echo "FATAL: staging directory $STAGE does not exist" >&2
      exit 1
    fi

    # ---------------------------------------------------------------- manifest
    echo "==> writing MANIFEST"
    {
      echo "backup_timestamp: ${BACKUP_TS}"
      echo "produced_by:      tas-backup CronJob (OPS-1)"
      echo "cluster:          ${CLUSTER_NAME}"
      echo ""
      echo "contents:"
      echo "  postgres-shared.sql.gz         pg_dumpall  <- postgres-shared      (aiqg, audimodal, tas_shared + roles)"
      echo "  keycloak-db.sql.gz             pg_dumpall  <- keycloak-db-shared   (the aether realm)"
      echo "  timescaledb-tas_events.sql.gz  pg_dump     <- timescaledb-shared   (hypertables: events, aiqg.event_metrics)"
      echo "  neo4j.cypher.gz                APOC export <- ${NEO4J_HOST}"
      echo ""
      echo "sha256:"
      ( cd "$STAGE" && sha256sum ./*.gz | sed 's/^/  /' )
    } > "$STAGE/MANIFEST"
    cat "$STAGE/MANIFEST"

    # ----------------------------------------------------------------- promote
    # Only a complete set gets a visible name. Everything under .in-progress/ is
    # by definition untrustworthy: it is never synced offsite and RESTORE.md
    # never restores from it. This is what makes "is this restore point good?"
    # an answerable question rather than a hopeful one.
    mv "$STAGE" "$FINAL"
    echo "${BACKUP_TS}" > "${BACKUP_ROOT}/db/LATEST"
    echo "==> promoted ${BACKUP_TS}"

    # ------------------------------------------------------------ minio mirror
    # Object storage is mirrored rather than snapshotted: a per-run copy of
    # every bucket would multiply ~291 MB by the retention count for no real
    # gain. --backup-dir keeps the safety property that matters -- an object
    # that is overwritten or deleted upstream is moved into superseded/<ts>/
    # rather than being lost from the backup on the next run.
    echo "==> mirroring MinIO"
    if ! rclone lsd MINIOSRC: --retries 3 > /tmp/buckets.txt; then
      echo "FATAL: cannot list MinIO buckets -- refusing to sync (would look like mass deletion)" >&2
      exit 1
    fi
    if [ ! -s /tmp/buckets.txt ]; then
      echo "FATAL: MinIO reported zero buckets -- refusing to sync over a good mirror" >&2
      exit 1
    fi
    echo "  buckets visible upstream:"
    sed 's/^/    /' /tmp/buckets.txt

    # loki-data and spark-checkpoints are deliberately excluded: Loki chunks are
    # observability data with their own 30-day retention and Spark checkpoints
    # regenerate. Between them they are 569 MB of the 860 MB total. Excluding by
    # name (rather than listing what to include) means a NEW bucket is backed up
    # by default -- the safe direction for a backup to fail in. See OPS-20.
    rclone sync MINIOSRC: "${BACKUP_ROOT}/minio/current" \
      --exclude "/loki-data/**" \
      --exclude "/spark-checkpoints/**" \
      --backup-dir "${BACKUP_ROOT}/minio/superseded/${BACKUP_TS}" \
      --stats-one-line --stats 30s --retries 3
    echo "==> MinIO mirror complete"

    # ------------------------------------------------------------------ offsite
    OFFSITE_SKIPPED=""
    OFFSITE_ANY=""
    if [ -n "${R2_ACCESS_KEY_ID:-}" ] || [ -n "${B2_ACCOUNT_ID:-}" ]; then
      OFFSITE_ANY=1
    fi

    # Offsite copies are ALWAYS client-side encrypted with rclone crypt, so R2
    # and B2 only ever hold ciphertext with encrypted file and directory names.
    # The dumps contain Keycloak password hashes and client secrets and every
    # tenant's AIQG data; provider-side encryption at rest would leave the
    # provider holding the key. There is deliberately no plaintext fallback: if
    # credentials exist but the passphrase does not, the run fails rather than
    # uploading in the clear.
    if [ -n "$OFFSITE_ANY" ]; then
      if [ -z "${CRYPT_PASSWORD:-}" ] || [ -z "${CRYPT_SALT:-}" ]; then
        echo "FATAL: offsite credentials are set but crypt-password/crypt-salt are not." >&2
        echo "       Refusing to upload unencrypted backups. See 10-secret.example.yaml." >&2
        exit 1
      fi
      CRYPT_OBSCURED_PW="$(rclone obscure "$CRYPT_PASSWORD")"
      CRYPT_OBSCURED_SALT="$(rclone obscure "$CRYPT_SALT")"
    fi

    # One passphrase for both targets, so a single secret restores either.
    wrap_crypt() {
      name="$1"; base="$2"
      export "RCLONE_CONFIG_${name}_TYPE=crypt"
      export "RCLONE_CONFIG_${name}_REMOTE=${base}"
      export "RCLONE_CONFIG_${name}_PASSWORD=${CRYPT_OBSCURED_PW}"
      export "RCLONE_CONFIG_${name}_PASSWORD2=${CRYPT_OBSCURED_SALT}"
    }

    push_offsite() {
      remote="$1"   # a crypt remote -- never the raw bucket
      label="$2"
      scope="$3"
      key="$4"      # short target label for the offsite metric (OPS-21)

      echo "==> offsite: ${label} (${scope}, encrypted)"
      # Versioned database dumps -- ~8 MB per run, so hundreds of restore
      # points fit inside a 10 GB free tier.
      rclone copy "${BACKUP_ROOT}/db/${BACKUP_TS}" "${remote}:db/${BACKUP_TS}" \
        --stats-one-line --stats 30s --retries 3

      # Prove the upload is readable, not just present: cryptcheck re-encrypts
      # each local file with the nonce stored remotely and compares hashes, so
      # a wrong passphrase or a corrupted object fails the run tonight rather
      # than during a restore.
      rclone cryptcheck "${BACKUP_ROOT}/db/${BACKUP_TS}" "${remote}:db/${BACKUP_TS}" --one-way
      echo "  ${label} db set verified by cryptcheck"

      if [ "$scope" = "full" ]; then
        rclone sync "${BACKUP_ROOT}/minio/current" "${remote}:minio/current" \
          --backup-dir "${remote}:minio/superseded/${BACKUP_TS}" \
          --stats-one-line --stats 30s --retries 3
      fi
      # Written only past cryptcheck, so the marker means "a readable copy is
      # up there", not "an upload was attempted". TASBackupOffsiteStalled
      # watches this per target (OPS-21).
      date +%s > "${OFFSITE_MARK_PREFIX}${key}"
      echo "  ${label} ok"
    }

    if [ -n "${R2_ACCESS_KEY_ID:-}" ]; then
      wrap_crypt R2C "R2:${R2_BUCKET}"
      push_offsite R2C "Cloudflare R2" full r2
    else
      echo "!! Cloudflare R2 not configured -- no offsite copy written"
      OFFSITE_SKIPPED="${OFFSITE_SKIPPED} r2"
    fi

    if [ -n "${B2_ACCOUNT_ID:-}" ]; then
      wrap_crypt B2C "B2:${B2_BUCKET}"
      push_offsite B2C "Backblaze B2" db-only b2
    else
      echo "!! Backblaze B2 not configured -- no break-glass copy written"
      OFFSITE_SKIPPED="${OFFSITE_SKIPPED} b2"
    fi

    # ---------------------------------------------------------------- retention
    echo "==> retention"
    prune_local() {
      dir="$1"; keep="$2"; what="$3"
      [ -d "$dir" ] || return 0
      # Timestamps sort lexically because they are YYYYmmddTHHMMSSZ.
      ( cd "$dir" && ls -1d 2*/ 2>/dev/null | sed 's#/$##' | sort -r | tail -n +$((keep + 1)) ) \
        | while read -r old; do
            [ -n "$old" ] || continue
            echo "  pruning ${what}/${old}"
            rm -rf "${dir:?}/${old:?}"
          done
    }
    prune_local "${BACKUP_ROOT}/db" "$KEEP_LOCAL_DB" "db"
    prune_local "${BACKUP_ROOT}/minio/superseded" "$KEEP_LOCAL_SUPERSEDED" "minio/superseded"

    prune_remote() {
      remote="$1"; keep="$2"; label="$3"
      # Listed THROUGH the crypt remote, so directory names come back decrypted
      # and still sort by timestamp. Listing the raw bucket would return
      # ciphertext names in random order and prune the wrong sets.
      rclone lsf "${remote}:db/" --dirs-only 2>/dev/null \
        | sed 's#/$##' | grep -E '^[0-9]{8}T[0-9]{6}Z$' | sort -r | tail -n +$((keep + 1)) \
        | while read -r old; do
            [ -n "$old" ] || continue
            echo "  pruning ${label} db/${old}"
            rclone purge "${remote}:db/${old}" || true
          done
    }
    if [ -n "${R2_ACCESS_KEY_ID:-}" ]; then
      prune_remote R2C "$KEEP_R2_DB" "R2"
    fi
    if [ -n "${B2_ACCOUNT_ID:-}" ]; then
      prune_remote B2C "$KEEP_B2_DB" "B2"
    fi

    # ------------------------------------------------------------------ verdict
    echo ""
    echo "================================================================"
    echo " backup ${BACKUP_TS} complete"
    ( cd "${BACKUP_ROOT}/db" && echo " local restore points: $(ls -1d 2*/ 2>/dev/null | wc -l)" )
    echo " local disk:          $(df -h "${BACKUP_ROOT}" | awk 'NR==2 {print $4" free of "$2}')"
    if [ -n "$OFFSITE_SKIPPED" ]; then
      echo ""
      echo " WARNING: no offsite copy for:${OFFSITE_SKIPPED}"
      if [ -z "$OFFSITE_ANY" ]; then
        echo " This backup exists only on /dev/sda1, the same disk as the data it"
        echo " protects. It survives a bad migration; it does not survive the disk."
      else
        echo " Other offsite copies were written and verified, so this is a loss of"
        echo " redundancy, not of disk-loss protection."
      fi
      echo " Fix: fill in tas-backup-credentials (see 10-secret.example.yaml)."
      if [ "${OFFSITE_REQUIRED}" = "true" ]; then
        echo " OFFSITE_REQUIRED=true -- failing the job."
        exit 1
      fi
    fi
    echo "================================================================"

    # Last, so that reaching it means the whole run succeeded. The success
    # timestamp is read back from LATEST rather than from the clock, so what
    # Prometheus reports is the restore point that actually exists on disk.
    rm -f "$FAILURE_MARK"
    publish_metrics
