apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-shared
  namespace: tas-shared
  labels:
    app: prometheus-shared
    component: monitoring
spec:
  replicas: 1
  # Recreate (NOT RollingUpdate): with replicas=1 and a single PVC,
  # a rolling-update tries to start the new pod before the old one
  # releases the storage lock — new pod fails with "lock DB
  # directory: resource temporarily unavailable" and crashloops
  # until manual intervention. Recreate terminates the old pod
  # first, accepting a few seconds of metrics-scrape gap in exchange
  # for clean rollouts. (Source-synced 2026-06-04 after the
  # aiqg-metrics scrape-config rollout hit this deadlock.)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus-shared
  template:
    metadata:
      labels:
        app: prometheus-shared
        component: monitoring
    spec:
      serviceAccountName: prometheus-shared-sa
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
          name: prometheus
        args:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus'
        - '--web.console.libraries=/etc/prometheus/console_libraries'
        - '--web.console.templates=/etc/prometheus/consoles'
        # 30d, raised from 200h on 2026-09-22. The resource policy's profiling
        # step queries a 7d (168h) window; 200h left barely 32h of slack, so a
        # single restart or scrape gap could hollow out a p95 the moment
        # someone relied on it, and week-over-week comparison was impossible.
        # Headroom checked first: the PVC was 6% used (274G of 4.5T) with 21k
        # series, and the two new jobs add roughly 15k more.
        - '--storage.tsdb.retention.time=720h'
        - '--web.enable-lifecycle'
        - '--web.enable-remote-write-receiver'
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        # Alert rules live in their own ConfigMap mounted at the rules dir the
        # prometheus.yml rule_files glob (/etc/prometheus/rules/*.yml) reads.
        # Without this mount that glob matched nothing and no alerts loaded.
        - name: prometheus-rules
          mountPath: /etc/prometheus/rules
        - name: prometheus-data
          mountPath: /prometheus
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-shared-config
      - name: prometheus-rules
        configMap:
          name: prometheus-shared-rules
      - name: prometheus-data
        persistentVolumeClaim:
          claimName: prometheus-shared-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-shared
  namespace: tas-shared
  labels:
    app: prometheus-shared
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: server
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: prometheus
  selector:
    app: prometheus-shared

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-shared-pvc
  namespace: tas-shared
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-shared-config
  namespace: tas-shared
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    # AlertManager configuration
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager-shared:9093

    # Load rules once and periodically evaluate them
    rule_files:
      - "/etc/prometheus/rules/*.yml"

    scrape_configs:
      # Prometheus itself
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # AlertManager
      - job_name: 'alertmanager'
        static_configs:
          - targets: ['alertmanager-shared:9093']
        metrics_path: '/metrics'
        scrape_interval: 30s

      # Pushgateway — batch jobs that exit before anything can scrape them
      # (OPS-21). Today that is the nightly tas-backup CronJob.
      #
      # honor_labels: true is load-bearing. Without it Prometheus overwrites the
      # job= and instance= labels the pusher set with 'pushgateway' and the
      # gateway's own address, so every batch job's metrics collapse onto one
      # identity and you cannot tell which job last succeeded.
      - job_name: 'pushgateway'
        honor_labels: true
        static_configs:
          - targets: ['pushgateway-shared:9091']
        metrics_path: '/metrics'
        scrape_interval: 30s

      # OpenTelemetry Collector
      - job_name: 'otel-collector'
        static_configs:
          - targets: ['otel-collector-shared:8888']
        metrics_path: '/metrics'
        scrape_interval: 30s

      # Redis Exporter
      - job_name: 'redis-shared'
        static_configs:
          - targets: ['redis-exporter:9121']
        metrics_path: '/metrics'
        scrape_interval: 15s

      # PostgreSQL Exporter
      - job_name: 'postgres-shared'
        static_configs:
          - targets: ['postgres-exporter:9187']
        metrics_path: '/metrics'
        scrape_interval: 15s

      # Kafka Exporter
      - job_name: 'kafka-shared'
        static_configs:
          - targets: ['kafka-exporter:9308']
        metrics_path: '/metrics'
        scrape_interval: 30s

      # MinIO metrics (built-in Prometheus endpoint)
      - job_name: 'minio-shared'
        static_configs:
          - targets: ['minio-shared:9000']
        metrics_path: '/minio/v2/metrics/cluster'
        scrape_interval: 30s

      # Keycloak metrics (enabled with KC_METRICS_ENABLED=true)
      - job_name: 'keycloak-shared'
        static_configs:
          - targets: ['keycloak-shared:8080']
        metrics_path: '/metrics'
        scrape_interval: 30s

      # Shared infrastructure services (Kubernetes service discovery - annotation-based)
      - job_name: 'kubernetes-services'
        kubernetes_sd_configs:
        - role: service
          namespaces:
            names:
            - tas-shared
        relabel_configs:
        # Only scrape services with prometheus.io/scrape: "true"
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        # Use prometheus.io/port annotation if present
        - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        # Use prometheus.io/path annotation if present
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        # Add service and namespace labels
        - source_labels: [__meta_kubernetes_service_name]
          target_label: service
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace

      # Application services (cross-namespace discovery)
      - job_name: 'aether-backend'
        kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
            - aether
        relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: aether-backend
        - source_labels: [__meta_kubernetes_service_name]
          target_label: service
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace

      - job_name: 'deeplake-service'
        kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
            - deeplake
        relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: deeplake-service
        - source_labels: [__meta_kubernetes_service_name]
          target_label: service
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace

      - job_name: 'audimodal'
        kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
            - aether-be
        relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: audimodal
        - source_labels: [__meta_kubernetes_service_name]
          target_label: service
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        metrics_path: '/metrics/prometheus'

      # aiqg-dashboard-be — both deployments. Scraped for the digest-delivery
      # metrics (OPS-24): the daily admin digest silently stopped for ~20 days
      # and nothing noticed, because this service was not scraped at all.
      - job_name: 'aiqg-dashboard-be'
        kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
            - aiqg
        relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: aiqg-dashboard-be|aiqg-dashboard-be-public
        - source_labels: [__meta_kubernetes_service_name]
          target_label: service
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        metrics_path: '/metrics'

      - job_name: 'llm-router'
        # Target the tas-llm-router namespace where the Deployment
        # actually lives. The prior `llm-router` namespace doesn't
        # exist — this job has been silently failing endpoint
        # discovery since the service was renamed.
        kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
            - tas-llm-router
        relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: llm-router.*
        - source_labels: [__meta_kubernetes_service_name]
          target_label: service
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace

      - job_name: 'aiqg-metrics'
        # AIQG metrics endpoint added in tas-llm-router PR #37.
        # Same service endpoints as the legacy /metrics job, but
        # different path served by promhttp on a dedicated registry
        # (pkg/aiqg/metrics).
        kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
            - tas-llm-router
        metrics_path: /aiqg/metrics
        scrape_interval: 15s
        relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: llm-router.*
        - source_labels: [__meta_kubernetes_service_name]
          target_label: service
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace

      - job_name: 'tas-mcp-server'
        kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
            - tas-mcp
        relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: tas-mcp-server
        - source_labels: [__meta_kubernetes_service_name]
          target_label: service
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace

      # ---------------------------------------------------------------------
      # Container resource metrics (Phase 0 of MEMORY-RIGHTSIZING-PLAN.md)
      #
      # Until 2026-09-22 neither of the two queries CLAUDE.md's resource
      # policy is written around returned anything:
      #
      #   count({__name__=~"container_.*"})            => empty
      #   count(kube_pod_container_resource_requests)  => empty
      #
      # So "run it BestEffort for a week, then set requests to the observed
      # p95" was not a workflow anyone could actually execute, and the only
      # usage number available was `kubectl top` — a point sample from
      # metrics-server, which persists nothing. These two jobs are what make
      # the policy's profiling step real.
      # ---------------------------------------------------------------------

      # cAdvisor, via the kubelet on each node. Supplies
      # container_memory_working_set_bytes and container_cpu_usage_seconds_total
      # — the numerators in the policy's p95 queries.
      - job_name: 'kubernetes-cadvisor'
        scheme: https
        metrics_path: /metrics/cadvisor
        # 30s, not the 15s global default: the raw payload is ~5MB per node
        # per scrape. The keep-list below cuts what is stored, not what is
        # transferred and parsed.
        scrape_interval: 30s
        # The kubelet serves this on :10250 behind bearer-token auth. The
        # existing prometheus-shared-role already grants nodes/metrics and
        # nodes/proxy, so no RBAC change was needed — verified by probing both
        # kubelets with this ServiceAccount's token (HTTP 200 on each).
        authorization:
          type: Bearer
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          # k3s signs the kubelet certificate for the node's hostname, not for
          # the InternalIP that service discovery produces as __address__, so
          # verification fails on a name mismatch even though the CA is right.
          insecure_skip_verify: true
        # cAdvisor embeds its own collection timestamp, which lags the scrape
        # and is not evenly spaced. Honouring it produces gaps and out-of-order
        # samples that make rate() and quantile_over_time() unreliable — the
        # exact functions this whole job exists to serve.
        honor_timestamps: false
        kubernetes_sd_configs:
        - role: node
        relabel_configs:
        # role: node already sets __address__ to <InternalIP>:10250, so the
        # address needs no rewriting. Deliberately NOT doing the usual
        # `labelmap` of __meta_kubernetes_node_label_(.+): k3s nodes carry
        # a dozen labels each and that would copy every one of them onto
        # every container series.
        - source_labels: [__meta_kubernetes_node_name]
          target_label: node
        metric_relabel_configs:
        # Keep-list. The full payload is ~16.5k series per node, and ~6k of
        # that is per-device filesystem and blkio counters this cluster has no
        # use for. Measured 2026-09-22: 16,472 series in, 2,183 kept — an 87%
        # reduction, with every signal the policy and its follow-on ratio
        # alerting need still present.
        - source_labels: [__name__]
          action: keep
          regex: 'container_(memory_working_set_bytes|memory_rss|memory_usage_bytes|memory_max_usage_bytes|memory_cache|spec_memory_limit_bytes|cpu_usage_seconds_total|cpu_cfs_throttled_seconds_total|cpu_cfs_periods_total|spec_cpu_quota|spec_cpu_period|oom_events_total|last_seen)|machine_(memory_bytes|cpu_cores)'

      # kube-state-metrics. Supplies kube_pod_container_resource_requests —
      # what a workload *asked for*, which is the denominator of the
      # requested-vs-used ratio and exists in no other source.
      #
      # Its Service is intentionally not annotated for auto-discovery; see the
      # note in kube-state-metrics.yaml. Scraping it twice would double ~10k
      # series and give two job names for the same answer.
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics:8080']
        metrics_path: '/metrics'
        scrape_interval: 30s

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-shared-rules
  namespace: tas-shared
  labels:
    app: prometheus-shared
    component: alert-rules
data:
  # Alerting rules loaded via prometheus.yml rule_files (/etc/prometheus/rules/*.yml).
  # Alertmanager (alertmanager-shared:9093) routes what fires.
  # OPS-24. The admin activity digest is claimed through one shared row, so any
  # replica may be the sender: alert on the max across instances, never per pod.
  aiqg-digest-alerts.yml: |
    groups:
      - name: aiqg_activity_digest
        interval: 60s
        rules:
          # The failure that actually happened: delivery simply stopped —
          # 2026-08-28 to 2026-09-17, no error anyone saw, because every pod was
          # degraded and no digest worker ran. Silence is the signal, so this
          # alerts on staleness rather than on errors. The digest is sent once a
          # day at 13:00 UTC; 26h allows a late send plus a missed tick without
          # firing, and catches a genuine miss the following day.
          - alert: AIQGActivityDigestStalled
            expr: time() - max(aiqg_activity_digest_last_success_timestamp_seconds) > 26 * 3600
            for: 30m
            labels:
              severity: warning
              service: aiqg-dashboard-be
              component: activity-digest
            annotations:
              summary: "AIQG admin activity digest has not been sent for over 26h"
              description: >
                No replica has recorded a successful admin digest send in
                {{ $value | humanizeDuration }}. The gauge is seeded at boot from
                aiqg.notification_log, so this is a real miss, not a restart.
                Usual causes: the mail workers are gated off because this
                deployment has no SMTP password (look for "SMTP username set
                without a password" at boot), PostgreSQL was unavailable at boot
                so the workers never started (OPS-19), or the Brevo relay is
                rejecting the credential (535).

          # The metric vanishing is the same outage wearing a different hat: a
          # pod that cannot reach PostgreSQL at boot never starts the worker, and
          # a stale image does not export the gauge at all. Without this, "no
          # data" would read as "nothing wrong".
          - alert: AIQGActivityDigestMetricMissing
            expr: absent(aiqg_activity_digest_last_success_timestamp_seconds)
            for: 30m
            labels:
              severity: warning
              service: aiqg-dashboard-be
              component: activity-digest
            annotations:
              summary: "AIQG digest health metric is not being reported"
              description: >
                No aiqg-dashboard-be replica has exported
                aiqg_activity_digest_last_success_timestamp_seconds for 30m.
                Either the scrape target is down, or every replica has the digest
                worker disabled. Check "up{job='aiqg-dashboard-be'}" first.

          # Credentials or relay wrong: sends are being attempted and refused.
          # Distinct from staleness — this fires within the hour, before the
          # 26h threshold, when the relay starts rejecting us.
          - alert: AIQGActivityDigestSendFailing
            expr: increase(aiqg_activity_digest_send_failures_total[1h]) > 3
            for: 0m
            labels:
              severity: warning
              service: aiqg-dashboard-be
              component: activity-digest
            annotations:
              summary: "AIQG admin activity digest sends are failing"
              description: >
                {{ $value | printf "%.0f" }} failed digest send attempts in the
                last hour on {{ $labels.instance }}. A 535 means the SMTP
                credential is wrong or missing; the send is retried every 15
                minutes, and the claim is released each time.

  # OPS-21. The nightly tas-backup CronJob is the only thing standing between
  # this cluster and permanent data loss, and it cannot be scraped: the pod
  # exits long before Prometheus would come looking. So it pushes its own
  # result to pushgateway-shared when it finishes, and these rules alert on the
  # timestamp going stale.
  #
  # The design point: a backup that stops running produces NOTHING — no error,
  # no failed pod, no log line anybody reads. Silence is indistinguishable from
  # success unless something watches the clock. Every alert here is therefore
  # written against absence, not against errors.
  # OPS-27: manifest-vs-cluster drift, published by scripts/drift-check.sh.
  # Its own file rather than a group inside backup-alerts.yml — the rule_files
  # glob is /etc/prometheus/rules/*.yml, so each concern keeps its own name.
  drift-alerts.yml: |
    groups:
      - name: tas_drift
        interval: 60s
        rules:
          # OPS-27. `kubectl diff -k` is the only thing that says whether a
          # kustomize tree still describes what is running, and nothing ran it
          # — drift was found when somebody happened to look. scripts/drift-check.sh
          # now runs it over every tree from cron and pushes the result here.
          #
          # The staleness rule is the one that matters, for the same reason as
          # TASBackupStalled: it covers every way the check can stop happening
          # at once — cron removed, workstation off, kubectl credentials
          # expired, script erroring early.
          - alert: TASDriftCheckStalled
            expr: time() - tas_drift_last_success_timestamp_seconds > 26 * 3600
            for: 0m
            labels:
              severity: warning
              service: drift-check
              component: config
            annotations:
              summary: "No manifest drift check in over 26 hours"
              description: >
                drift-check.sh last completed {{ $value | humanizeDuration }}
                ago, so nothing currently knows whether the committed manifests
                still match the cluster. Run
                aether-shared/scripts/drift-check.sh by hand and check the
                workstation crontab.

          # Without this, a check that never ran at all reads as "no data",
          # which every dashboard renders as blank rather than as alarming.
          # This is the specific failure this whole item exists to prevent.
          - alert: TASDriftCheckMetricMissing
            expr: absent(tas_drift_last_success_timestamp_seconds)
            for: 30m
            labels:
              severity: warning
              service: drift-check
              component: config
            annotations:
              summary: "The manifest drift check has published nothing"
              description: >
                tas_drift_last_success_timestamp_seconds is absent. Either the
                check has never run since the gateway was reset, or it is
                failing before it can publish. Silence here is not health.

          # RATCHETS, not absolute targets. As of 2026-09-18 the tree has 17
          # drifted and 7 uncheckable, each of which needs a per-repo decision
          # about whether git or the cluster is right (OPS-27). Alerting on
          # "> 0" today would ship an alert that is red from the first day,
          # and an alert that is always red is one people learn to scroll past
          # — the failure mode OPS-21 already documented.
          #
          # So these fire only on a REGRESSION past today's known backlog.
          # LOWER THESE NUMBERS as the backlog is worked down; a ratchet that
          # is never tightened is just a disabled alert with extra steps.
          # 7 -> 6 when kokoro-tts's probes were fixed (tas-mcp-servers#23),
          # then 6 -> 4 when drift-check stopped diffing child kustomizations:
          # components are never applied standalone, so three of the counted
          # failures were an artefact of measuring them that way. Every tree
          # repaired — or correctly excluded — lowers the bar, so the next
          # regression is caught instead of hiding under the old allowance.
          - alert: TASDriftUncheckableRising
            expr: tas_drift_trees_uncheckable > 4
            for: 2h
            labels:
              severity: warning
              service: drift-check
              component: config
            annotations:
              summary: "More kustomize trees cannot be checked than before"
              description: >
                {{ $value }} trees now fail to evaluate, above the 4 known on
                2026-09-19. A newly uncheckable tree is worse than a drifted
                one: it reports nothing rather than something wrong.

          - alert: TASDriftRising
            expr: tas_drift_trees_drifted > 7
            for: 2h
            labels:
              severity: warning
              service: drift-check
              component: config
            annotations:
              summary: "More kustomize trees drifted from the cluster than before"
              description: >
                {{ $value }} trees differ from what is running, above the 7
                known on 2026-09-19 (the earlier 17 counted child
                kustomizations that are never applied on their own). Run
                aether-shared/scripts/drift-check.sh to see which.


  backup-alerts.yml: |
    groups:
      - name: tas_backup
        interval: 60s
        rules:
          # The one that matters. tas-backup runs at 03:30 UTC daily and
          # pushes this only after the full set is sealed, mirrored, shipped
          # offsite and verified by cryptcheck — so a stale value covers every
          # failure mode at once: a failed dump, an unschedulable pod, a full
          # disk, a suspended CronJob, a node that was off at 03:30.
          # 26h = one daily cycle plus two hours of slack (startingDeadline is
          # 7200s, so a late run is legitimate), which means a single missed
          # night fires the following morning rather than going unnoticed.
          - alert: TASBackupStalled
            expr: time() - tas_backup_last_success_timestamp_seconds > 26 * 3600
            for: 0m
            labels:
              severity: critical
              service: tas-backup
              component: backup
            annotations:
              summary: "No successful TAS backup in over 26 hours"
              description: >
                The last successful tas-backup run finished
                {{ $value | humanizeDuration }} ago. Nothing has produced a
                restore point since. Check "kubectl get jobs -n tas-shared -l
                app=tas-backup" and the Loki stream
                {namespace="tas-shared", app="tas-backup"}.

          # Pushgateway persists its store to a PVC precisely so a restart does
          # not erase the timestamp — but if the metric disappears anyway, the
          # watcher itself is broken and the backup is once again unobserved.
          # Without this rule that state reads as "no data", which looks like
          # health on every dashboard ever made.
          - alert: TASBackupMetricMissing
            expr: absent(tas_backup_last_success_timestamp_seconds)
            for: 30m
            labels:
              severity: critical
              service: tas-backup
              component: backup
            annotations:
              summary: "Backup health metric is not being reported"
              description: >
                tas_backup_last_success_timestamp_seconds has been absent for
                30m, so backup staleness is no longer being detected. Either
                pushgateway-shared is down or its persistence file was lost.
                Check "up{job='pushgateway'}" first, then re-seed with the
                LATEST file (see backup/README.md §Alerting).

          # Faster than staleness, and narrower: finalize.sh traps its own
          # failure and pushes a timestamp before exiting, so a run that gets
          # as far as sealing and then dies reports within the minute instead
          # of waiting 26 hours. Dump failures in the initContainers never
          # reach this — those are caught by TASBackupStalled.
          - alert: TASBackupRunFailed
            expr: >
              tas_backup_last_failure_timestamp_seconds >
              tas_backup_last_success_timestamp_seconds
            for: 5m
            labels:
              severity: warning
              service: tas-backup
              component: backup
            annotations:
              summary: "The most recent TAS backup run failed"
              description: >
                A tas-backup run failed after the dump stage and no successful
                run has completed since. The staged set was never promoted, so
                the previous restore point is still intact — but there is no
                new one.

          # The offsite copy is the only protection against losing the disk,
          # and it can fail on its own (expired R2 token, bucket policy, quota)
          # while the local set is written perfectly. finalize.sh only warns
          # about this today unless OFFSITE_REQUIRED=true, so without this rule
          # a cluster can spend weeks with local-only backups.
          - alert: TASBackupOffsiteStalled
            expr: time() - tas_backup_offsite_last_success_timestamp_seconds > 26 * 3600
            for: 0m
            labels:
              severity: warning
              service: tas-backup
              component: backup
            annotations:
              summary: "TAS backup offsite copy ({{ $labels.target }}) is stale"
              description: >
                No verified offsite push to {{ $labels.target }} in
                {{ $value | humanizeDuration }}. Backups may exist only on
                /dev/sda1, the same disk as the data they protect.

  semcache-judge-alerts.yml: |
    groups:
      - name: aiqg_semcache_judge
        interval: 30s
        rules:
          # The daily judge $ cap (§14.1) was reached and grading is paused until
          # UTC midnight — samples are being skipped ungraded. This is the alert
          # requested for "budget got hit".
          - alert: AIQGSemCacheJudgeBudgetExhausted
            expr: increase(aiqg_semcache_judge_budget_skipped_total[15m]) > 0
            for: 0m
            labels:
              severity: warning
              service: tas-llm-router
              component: aiqg-semcache-judge
            annotations:
              summary: "AIQG semantic-cache L3 judge hit its daily spend cap"
              description: >
                The L3 judge skipped {{ $value | printf "%.0f" }} sample(s) in the last 15m
                because the daily USD cap was reached (see aiqg_semcache_judge_budget_cap_usd).
                Grading is paused until UTC midnight. If unexpected, raise
                AIQG_SEMCACHE_JUDGE_DAILY_USD or lower AIQG_SEMCACHE_JUDGE_SAMPLE_RATE.

          # Early warning: today's spend has crossed 80% of the cap (skip when the
          # cap is unlimited / 0).
          - alert: AIQGSemCacheJudgeBudgetNearCap
            expr: >
              aiqg_semcache_judge_budget_cap_usd > 0
              and
              (aiqg_semcache_judge_budget_spent_usd / aiqg_semcache_judge_budget_cap_usd) >= 0.8
            for: 5m
            labels:
              severity: info
              service: tas-llm-router
              component: aiqg-semcache-judge
            annotations:
              summary: "AIQG L3 judge daily spend at {{ $value | humanizePercentage }} of cap"
              description: >
                Today's judge spend (aiqg_semcache_judge_budget_spent_usd) is at least 80%
                of the daily cap. It will stop grading when the cap is reached and resume at
                UTC midnight.

  # Availability and quality alerting for tas-llm-router.
  #
  # Before these existed, the only alerts touching this service covered the
  # semantic-cache judge's spend budget — nothing paged when the router itself
  # was down or failing requests.
  #
  # Every expression below is built on a signal verified live on 2026-08-24:
  # `up` (produced by Prometheus itself) and the `aiqg_*` family served from
  # /aiqg/metrics. Deliberately NOT used: the `llm_router_*` family on /metrics,
  # which serves static placeholder values (counters did not move across repeated
  # scrapes; auth_attempts_total reads 1.43e9; real 401s absent from
  # errors_total). Any rate() over those metrics is 0 forever, so an alert built
  # on them would never fire while looking like coverage.
  llm-router-availability-alerts.yml: |
    groups:
      - name: llm_router_availability
        interval: 30s
        rules:
          # Total outage. Both scrape jobs cover the same pods, so either going
          # fully dark means no replica is serving.
          - alert: LLMRouterAllReplicasDown
            expr: sum by (job) (up{job=~"llm-router|aiqg-metrics"}) == 0
            for: 2m
            labels:
              severity: critical
              service: tas-llm-router
              component: availability
            annotations:
              summary: "tas-llm-router has no reachable replica (job {{ $labels.job }})"
              description: >
                Every scrape target for {{ $labels.job }} has been down for 2m. All
                text generation across TAS is failing: Aether chat, agent execution,
                workflow model steps, and AIQG scanning. Document upload, search and
                the graph database are unaffected. Runbook: docs/ops/llm-router.md
                in tas-llm-router.

          # Partial loss. Two replicas per deployment, so one down is degraded
          # rather than an outage — but on a single node it is also the shape a
          # BestEffort eviction takes.
          - alert: LLMRouterReplicaDown
            expr: up{job=~"llm-router|aiqg-metrics"} == 0
            for: 5m
            labels:
              severity: warning
              service: tas-llm-router
              component: availability
            annotations:
              summary: "tas-llm-router replica {{ $labels.instance }} unreachable for 5m"
              description: >
                Scrape target {{ $labels.instance }} ({{ $labels.job }}) has been down
                for 5m while others still respond. Check for eviction — llm-router-aiqg
                is BestEffort and is evicted first under node pressure, and node
                um773dev was at 92% memory requests on 2026-08-24.

          # Request quality degrading. `tier` carried only "healthy" at authoring
          # time; matching tier!="healthy" means this stays silent until a
          # non-healthy tier actually appears rather than guessing its name.
          - alert: AIQGRequestTierDegraded
            expr: sum by (dimension) (rate(aiqg_request_tier_total{tier!="healthy"}[15m])) > 0
            for: 10m
            labels:
              severity: warning
              service: tas-llm-router
              component: aiqg-quality
            annotations:
              summary: "AIQG {{ $labels.dimension }} tier non-healthy for 10m"
              description: >
                Requests have been scored outside the healthy tier on the
                {{ $labels.dimension }} dimension for 10m. This is a quality signal,
                not an availability one — the gateway is serving, but assurance,
                latency, or composite scoring has degraded.

          # Telemetry loss. Every AIQG event feeds spend attribution and the
          # dashboard; silent emitter failure means the record is wrong, and
          # nothing else reports it.
          - alert: AIQGEventEmissionFailing
            expr: sum by (emitter) (rate(aiqg_events_emitted_total{outcome!="success"}[10m])) > 0
            for: 10m
            labels:
              severity: warning
              service: tas-llm-router
              component: aiqg-telemetry
            annotations:
              summary: "AIQG event emission failing via {{ $labels.emitter }}"
              description: >
                The {{ $labels.emitter }} emitter has been returning non-success
                outcomes for 10m. AIQG events feed spend attribution and the dashboard,
                so this loses records without failing user requests. For the kafka
                emitter, check kafka-shared.tas-shared:9092 before suspecting the router.

          # Kafka emit latency sits in the request path; sustained p95 above a
          # second indicates broker trouble rather than a router fault.
          - alert: AIQGEmitLatencyHigh
            expr: >
              histogram_quantile(0.95,
                sum by (le, emitter) (rate(aiqg_emit_duration_seconds_bucket{emitter="kafka"}[10m]))
              ) > 1
            for: 10m
            labels:
              severity: warning
              service: tas-llm-router
              component: aiqg-telemetry
            annotations:
              summary: "AIQG kafka emit p95 above 1s"
              description: >
                p95 emit duration to the kafka emitter has exceeded 1s for 10m
                (observed mean was ~0.2s on 2026-08-24). Investigate
                kafka-shared.tas-shared:9092 first.

---
# OpenTelemetry Collector Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector-shared
  namespace: tas-shared
  labels:
    app: otel-collector-shared
    component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector-shared
  template:
    metadata:
      labels:
        app: otel-collector-shared
        component: observability
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:latest
        ports:
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
        - containerPort: 8888
          name: metrics
        - containerPort: 8889
          name: prom-exporter
        - containerPort: 13133
          name: health-check
        command:
        - /otelcol-contrib
        - --config=/etc/otelcol-contrib/otel-collector.yaml
        env:
        - name: ENVIRONMENT
          value: "kubernetes"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: otel-collector-config
          mountPath: /etc/otelcol-contrib
        livenessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: otel-collector-config
        configMap:
          name: otel-collector-shared-config

---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-shared
  namespace: tas-shared
  labels:
    app: otel-collector-shared
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8889"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - port: 4317
    targetPort: 4317
    protocol: TCP
    name: otlp-grpc
  - port: 4318
    targetPort: 4318
    protocol: TCP
    name: otlp-http
  - port: 8888
    targetPort: 8888
    protocol: TCP
    name: metrics
  - port: 8889
    targetPort: 8889
    protocol: TCP
    name: prom-exporter
  - port: 13133
    targetPort: 13133
    protocol: TCP
    name: health-check
  selector:
    app: otel-collector-shared

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-shared-config
  namespace: tas-shared
data:
  otel-collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      
      prometheus:
        config:
          scrape_configs:
          - job_name: 'otel-collector'
            scrape_interval: 10s
            static_configs:
            - targets: ['0.0.0.0:8888']

    processors:
      batch:
        timeout: 1s
        send_batch_size: 1024
      
      resource:
        attributes:
        - key: environment
          value: kubernetes
          action: upsert
        - key: service.name
          from_attribute: service
          action: insert

    exporters:
      prometheus:
        endpoint: "0.0.0.0:8889"

      debug:
        verbosity: detailed

      # Export to Prometheus (metrics)
      prometheusremotewrite:
        endpoint: "http://prometheus-shared:9090/api/v1/write"
        tls:
          insecure: true

      # Export to Jaeger (traces) - uncomment if Jaeger is deployed
      # jaeger:
      #   endpoint: jaeger-collector:14250
      #   tls:
      #     insecure: true

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch, resource]
          exporters: [debug]  # Add jaeger when available

        metrics:
          receivers: [otlp, prometheus]
          processors: [batch, resource]
          exporters: [prometheus, prometheusremotewrite]

        logs:
          receivers: [otlp]
          processors: [batch, resource]
          exporters: [debug]

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-shared
  namespace: tas-shared
  labels:
    app: grafana-shared
    component: monitoring
spec:
  replicas: 1
  # Grafana 13's unified-search bleve index holds a file lock on the
  # single ReadWriteOnce grafana-data PVC. With RollingUpdate the new
  # pod cannot acquire the lock while the old pod still holds it, so the
  # rollout deadlocks (new pod CrashLoopBackOff: "index is locked by
  # another process"). Recreate terminates the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana-shared
  template:
    metadata:
      labels:
        app: grafana-shared
        component: monitoring
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
          name: grafana
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-shared-secret
              key: admin-password
        - name: GF_PATHS_PROVISIONING
          value: /etc/grafana/provisioning
        # SEC-21: supplies $PG_AUDIMODAL_PASSWORD to the provisioned
        # PostgreSQL-AudiModal datasource above, so the shared database
        # password is not written into this ConfigMap.
        - name: PG_AUDIMODAL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-pg-password
              key: PG_AUDIMODAL_PASSWORD
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: grafana-data
          mountPath: /var/lib/grafana
        - name: grafana-provisioning-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-provisioning-dashboards
          mountPath: /etc/grafana/provisioning/dashboards
        - name: dashboards-llm-router
          mountPath: /var/lib/grafana/dashboards/llm-router
        - name: dashboards-audimodal
          mountPath: /var/lib/grafana/dashboards/audimodal
        - name: dashboards-loki
          mountPath: /var/lib/grafana/dashboards/loki
        - name: dashboards-deeplake
          mountPath: /var/lib/grafana/dashboards/deeplake
        - name: dashboards-aether
          mountPath: /var/lib/grafana/dashboards/aether
        - name: dashboards-infrastructure
          mountPath: /var/lib/grafana/dashboards/infrastructure
        - name: dashboards-tas-applications
          mountPath: /var/lib/grafana/dashboards/tas-applications
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: grafana-data
        persistentVolumeClaim:
          claimName: grafana-shared-pvc
      - name: grafana-provisioning-datasources
        configMap:
          name: grafana-shared-config
      - name: grafana-provisioning-dashboards
        configMap:
          name: grafana-provisioning-dashboards
      - name: dashboards-llm-router
        configMap:
          name: grafana-dashboards-llm-router
      - name: dashboards-audimodal
        configMap:
          name: grafana-dashboards-audimodal
      - name: dashboards-loki
        configMap:
          name: grafana-dashboards-loki
      - name: dashboards-deeplake
        configMap:
          name: grafana-dashboards-deeplake
      - name: dashboards-aether
        configMap:
          name: grafana-dashboards-aether
      - name: dashboards-infrastructure
        configMap:
          name: grafana-dashboards-infrastructure
      - name: dashboards-tas-applications
        configMap:
          name: grafana-dashboards-tas-applications

---
apiVersion: v1
kind: Service
metadata:
  name: grafana-shared
  namespace: tas-shared
  labels:
    app: grafana-shared
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: grafana
  selector:
    app: grafana-shared

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-shared-pvc
  namespace: tas-shared
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-shared-secret
  namespace: tas-shared
type: Opaque
data:
  admin-password: YWRtaW4xMjM=  # admin123 (base64)

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-shared-config
  namespace: tas-shared
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-shared:9090
        isDefault: true
        editable: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-shared:3100
        editable: true
      - name: AlertManager
        type: alertmanager
        access: proxy
        url: http://alertmanager-shared:9093
        editable: true
      - name: PostgreSQL-AudiModal
        type: postgres
        uid: pg-audimodal
        orgId: 1
        version: 2
        access: proxy
        url: postgres-shared:5432
        database: audimodal
        user: tasuser
        secureJsonData:
          # SEC-21: Grafana expands $VAR in provisioning files from its own
          # environment, so the password is supplied by Secret
          # tas-shared/grafana-pg-password rather than written here.
          password: $PG_AUDIMODAL_PASSWORD
        jsonData:
          sslmode: disable
          maxOpenConns: 5
          maxIdleConns: 2
          connMaxLifetime: 14400
          postgresVersion: 1500
          timescaledb: false
        isDefault: false
        editable: true
      # AIQG event stream (gateway-written hypertable). Backs the caching /
      # top-misses panels — reads aiqg.event_metrics on the TimescaleDB instance.
      - name: TimescaleDB-Events
        type: postgres
        uid: pg-tas-events
        orgId: 1
        version: 1
        access: proxy
        url: timescaledb-shared.tas-shared.svc.cluster.local:5432
        database: tas_events
        user: tas_events_rw
        secureJsonData:
          password: taseventspass
        jsonData:
          sslmode: disable
          maxOpenConns: 5
          maxIdleConns: 2
          connMaxLifetime: 14400
          postgresVersion: 1500
          timescaledb: true
        isDefault: false
        editable: true

  dashboards.yml: |
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      editable: true
      updateIntervalSeconds: 10
      options:
        path: /var/lib/grafana/dashboards

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: tas-shared
data:
  # Basic Kubernetes cluster overview dashboard
  kubernetes-overview.json: |
    {
      "dashboard": {
        "id": null,
        "title": "TAS Kubernetes Overview",
        "description": "Overview of TAS shared infrastructure services in Kubernetes",
        "panels": [
          {
            "id": 1,
            "title": "Service Status",
            "type": "stat",
            "targets": [
              {
                "expr": "up{job=~\"kubernetes-services|alertmanager|otel-collector\"}",
                "legendFormat": "{{service}} - {{instance}}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          }
        ],
        "time": {"from": "now-1h", "to": "now"},
        "refresh": "5s",
        "version": 1
      }
    }