apiVersion: v1
kind: Secret
metadata:
  name: timescaledb-shared-secret
  namespace: tas-shared
type: Opaque
data:
  username: dGFzX2V2ZW50c19ydw==  # tas_events_rw (base64)
  password: dGFzZXZlbnRzcGFzcw==  # taseventspass (base64)

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescaledb-shared
  namespace: tas-shared
  labels:
    app: timescaledb-shared
    component: database
spec:
  serviceName: timescaledb-shared
  replicas: 1
  selector:
    matchLabels:
      app: timescaledb-shared
  template:
    metadata:
      labels:
        app: timescaledb-shared
        component: database
    spec:
      containers:
      - name: timescaledb
        image: timescale/timescaledb:2.13.0-pg15
        ports:
        - name: postgres
          containerPort: 5432
          protocol: TCP
        env:
        - name: POSTGRES_DB
          value: "tas_events"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: timescaledb-shared-secret
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: timescaledb-shared-secret
              key: password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          limits:
            memory: "2Gi"
            cpu: "1000m"
          requests:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p 5432
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p 5432
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: timescaledb-storage
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: timescaledb-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 100Gi

---
apiVersion: v1
kind: Service
metadata:
  name: timescaledb-shared
  namespace: tas-shared
  labels:
    app: timescaledb-shared
    component: database
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: timescaledb-shared
