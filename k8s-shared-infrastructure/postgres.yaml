apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-shared
  namespace: tas-shared
  labels:
    app: postgres-shared
    component: database
spec:
  serviceName: postgres-shared-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres-shared
  template:
    metadata:
      labels:
        app: postgres-shared
        component: database
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - name: postgres
          containerPort: 5432
          protocol: TCP
        env:
        - name: POSTGRES_DB
          value: "tas_shared"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-shared-secret
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-shared-secret
              key: password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          limits:
            memory: "2Gi"
            cpu: "1000m"
          requests:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p 5432
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p 5432
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 50Gi

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-shared
  namespace: tas-shared
  labels:
    app: postgres-shared
    component: database
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: postgres-shared

---
# SEC-21 (2026-09-17) - two resources were deliberately removed from this file.
#
# 1. Service/postgres-shared-nodeport (NodePort 30432)
#    PostgreSQL was reachable from anywhere on the node's network using a
#    password that was committed in public repos. Deleted from the cluster.
#    Reach the database with a port-forward instead:
#      kubectl port-forward -n tas-shared svc/postgres-shared 5432:5432
#
# 2. Secret/postgres-shared-secret
#    It carried the default password documented in CLAUDE.md, which was also
#    the live production value. Rotated 2026-09-17. The Secret is left out
#    of this manifest rather than placeholdered: `kubectl apply` records the
#    keys it manages, so a file that omits `password` DELETES that key from the
#    live Secret, and a file with a placeholder overwrites it with a dead value.
#    Both break every consumer. Omitting the whole resource makes `apply` leave
#    it alone.
#
#    The live value lives in `aether-secrets/Shared-Postgres-Password`, whose
#    header lists every Secret that has to be rotated with it. Seed a fresh
#    cluster before anything connects:
#      kubectl create secret generic postgres-shared-secret -n tas-shared \
#        --from-literal=username=tasuser \
#        --from-literal=password="$(tail -1 aether-secrets/Shared-Postgres-Password)"
#
#    Git history still holds the old string, which is why rotation - not
#    scrubbing - is what actually closed SEC-21.
