apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-shared
  namespace: tas-shared
  labels:
    app: redis-shared
    component: cache
spec:
  replicas: 1
  # Recreate (not RollingUpdate): the data PVC is ReadWriteOnce, so the new pod
  # cannot mount it until the old pod releases it — a rolling update would stall.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis-shared
  template:
    metadata:
      labels:
        app: redis-shared
        component: cache
    spec:
      containers:
      - name: redis
        # Redis 8 bundles the Query Engine (FT.*) into core — required for the
        # AIQG semantic cache's vector index (C4). Command-compatible with 7 and
        # reads 7's AOF, so all existing consumers keep working on the same PVC.
        image: redis:8
        ports:
        - containerPort: 6379
          name: redis
        command:
        - redis-server
        - --appendonly
        - "yes"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-shared-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: redis-shared
  namespace: tas-shared
  labels:
    app: redis-shared
    component: cache
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: redis-shared

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-shared-pvc
  namespace: tas-shared
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi