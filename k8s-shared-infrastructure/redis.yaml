apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-shared
  namespace: tas-shared
  labels:
    app: redis-shared
    component: cache
spec:
  replicas: 1
  # Recreate (not RollingUpdate): the data PVC is ReadWriteOnce, so the new pod
  # cannot mount it until the old pod releases it — a rolling update would stall.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis-shared
  template:
    metadata:
      labels:
        app: redis-shared
        component: cache
    spec:
      containers:
      - name: redis
        # Redis 8 bundles the Query Engine (FT.*) into core — required for the
        # AIQG semantic cache's vector index (C4). Command-compatible with 7 and
        # reads 7's AOF, so all existing consumers keep working on the same PVC.
        image: redis:8
        ports:
        - containerPort: 6379
          name: redis
        # requirepass, from the Secret, never a literal here (SEC-24).
        # `sh -c` because redis-server does not expand $VARS in its own args;
        # `exec` so redis stays PID 1 and receives SIGTERM directly.
        command:
        - sh
        - -c
        - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-shared-auth
              key: password
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
        # The probes MUST authenticate. A bare `redis-cli ping` against a
        # password-protected server returns NOAUTH and exits non-zero, so
        # leaving these as they were would have had the kubelet kill this pod
        # in a loop the moment requirepass took effect.
        # --no-auth-warning keeps the "using a password on the command line"
        # notice off stderr; the password comes from the env, not argv.
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep -q PONG
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep -q PONG
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-shared-pvc

---
# ClusterIP ONLY — do not add a NodePort to this Service, and do not re-create
# `redis-shared-nodeport` (SEC-24, 2026-09-18).
#
# A NodePort on 30379 existed here from 2026-01 until 2026-09-18. It was never
# committed to this repo — it was applied straight to the cluster — so nothing
# in git recorded that redis-shared was reachable from the LAN. Measured from a
# workstation on the LAN on 2026-09-18, before it was deleted:
#
#   192.168.68.63:30379  ->  +PONG
#   ACL WHOAMI           ->  default        (user default on nopass ~* &* +@all)
#   GET federation:servers:neo4j-mcp
#     -> {"id":"neo4j-mcp","endpoint":"http://neo4j-mcp...:8000",...}
#
# That is full read/write/FLUSHALL for anyone on the network.
#
# Two kinds of data live here, and an earlier version of this comment got the
# second one wrong. (1) The MCP federation registry that `prod-tas-mcp` reads
# — writing `federation:servers:<id>.endpoint` repoints that server's tool
# traffic at a host of the writer's choosing. (2) The AIQG C1 response cache:
# `internal/server/server.go` builds ONE `sharedRedis` client from
# `AIQG_LINKAGE_REDIS_URL` and hands it to `responsecache.NewRedisCache`, and
# `AIQG_RESPONSE_CACHE_ENABLED` is true in production. So cached model
# responses do land in this instance, and a poisoned entry here is served to a
# customer as an answer. A snapshot can look like federation keys only — the
# response cache TTL is 10m, so entries come and go.
#
# What is NOT here is the SEMANTIC cache; that is `redis-semcache` (SEC-26).
#
# The shared PostgreSQL NodePort (30432) was removed for the same reason during
# SEC-21. If you need redis-cli access from a workstation, use
# `kubectl port-forward -n tas-shared svc/redis-shared 6379:6379` — it is
# authenticated by your kubeconfig and leaves nothing listening on the LAN.
#
# Authentication landed 2026-09-18: the server now runs with `--requirepass`
# from `tas-shared/redis-shared-auth`, and every consumer sends it. The value
# is documented in aether-secrets/Shared-Redis-Password, which lists all five
# Secrets that move together on a rotation.
apiVersion: v1
kind: Service
metadata:
  name: redis-shared
  namespace: tas-shared
  labels:
    app: redis-shared
    component: cache
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: redis-shared

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-shared-pvc
  namespace: tas-shared
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi