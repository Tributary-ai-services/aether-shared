---
# kube-state-metrics — the object-state half of the container metrics the
# resource policy depends on (Phase 0 of MEMORY-RIGHTSIZING-PLAN.md).
#
# WHY THIS EXISTS: CLAUDE.md § "Kubernetes Resource Requests Policy" tells you
# to run a workload BestEffort for a week and then size it from observed p95:
#
#   quantile_over_time(0.95, container_memory_working_set_bytes{pod=~"<svc>.*"}[7d])
#   count(kube_pod_container_resource_requests)
#
# Both queries returned empty in this cluster — verified 2026-09-22. Prometheus
# scraped 18 jobs and not one of them was cAdvisor or kube-state-metrics, so
# the profiling workflow the policy is built on could not be run, and nothing
# could alert on a workload approaching its limit: an OOM kill was the first
# signal. That is most of why declared requests drifted to 27,530Mi against
# 11,540Mi actually used without anyone noticing.
#
# cAdvisor (added as the 'kubernetes-cadvisor' job in monitoring.yaml) answers
# "how much is this container using". kube-state-metrics answers "how much did
# it ask for" — `kube_pod_container_resource_requests` is the denominator of
# the requested-vs-used ratio, and it exists nowhere else. metrics-server does
# not persist anything and `kubectl top` is a point sample, which is exactly
# the weak evidence the plan's tier B refuses to cut databases on.
#
# It also retires a caveat written into pushgateway.yaml (OPS-21): with this
# deployed, `kube_cronjob_status_last_successful_time` IS now a series, so the
# nightly tas-backup CronJob can be watched by object state as well as by the
# gauges it pushes. The pushgateway remains the source of truth for whether the
# backup *succeeded* — a CronJob that runs and fails still updates its
# last-schedule time.
#
# SCOPED DELIBERATELY: `--resources` below is an allowlist, not the default
# set. The default collects Secrets, ConfigMaps and the RBAC objects, which
# would mean granting this ServiceAccount cluster-wide list/watch on Secrets to
# produce metrics nothing here queries. The RBAC beneath matches the allowlist
# exactly — no secrets verb is granted at all. Adding a resource means adding
# it in BOTH places or the collector logs a permission error per sync.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: tas-shared
  labels:
    app: kube-state-metrics
    component: monitoring

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
  labels:
    app: kube-state-metrics
    component: monitoring
rules:
# Read-only, and only the resources named in --resources. No secrets,
# no configmaps, no RBAC objects — see the header note.
- apiGroups: [""]
  resources:
  - limitranges
  - namespaces
  - nodes
  - persistentvolumeclaims
  - pods
  - resourcequotas
  - services
  verbs: ["list", "watch"]
- apiGroups: ["apps"]
  resources:
  - daemonsets
  - deployments
  - replicasets
  - statefulsets
  verbs: ["list", "watch"]
- apiGroups: ["batch"]
  resources:
  - cronjobs
  - jobs
  verbs: ["list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
  labels:
    app: kube-state-metrics
    component: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
- kind: ServiceAccount
  name: kube-state-metrics
  namespace: tas-shared

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: tas-shared
  labels:
    app: kube-state-metrics
    component: monitoring
spec:
  replicas: 1
  # A second replica would not share work — each one lists every object and
  # exports the same series, so Prometheus would scrape duplicates under one
  # job. Sharding is a --shard/--total-shards concern, not a replica count.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
        component: monitoring
    spec:
      serviceAccountName: kube-state-metrics
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: kube-state-metrics
        # Pinned, per OPS-14. v2.18.0 verified present in registry.k8s.io on
        # 2026-09-22; the cluster is k3s v1.33.1.
        image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.18.0
        args:
        # Allowlist — see header. Keep in step with the ClusterRole above.
        - --resources=cronjobs,daemonsets,deployments,jobs,limitranges,namespaces,nodes,persistentvolumeclaims,pods,replicasets,resourcequotas,services,statefulsets
        - --port=8080
        - --telemetry-port=8081
        ports:
        - containerPort: 8080
          name: http-metrics
        - containerPort: 8081
          name: telemetry
        # Resources omitted — BestEffort QoS until profiled via Prometheus,
        # per CLAUDE.md. Re-profile once this has a week of its own data:
        #   quantile_over_time(0.95, container_memory_working_set_bytes{pod=~"kube-state-metrics.*"}[7d])
        # NOTE for whoever does that: BestEffort makes this the first thing
        # evicted under node pressure, and it is the only source of the
        # requested-vs-used series. That is the same mistake Phase 1 of
        # MEMORY-RIGHTSIZING-PLAN.md flags against metrics-server ("it is the
        # only usage telemetry there is"). A small Burstable floor is the
        # likely right answer here — it just needs a measured number first.
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        livenessProbe:
          httpGet:
            path: /livez
            port: 8080
          initialDelaySeconds: 5
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          timeoutSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: tas-shared
  labels:
    app: kube-state-metrics
    component: monitoring
  # DELIBERATELY NOT annotated with prometheus.io/scrape. The
  # 'kubernetes-services' job in monitoring.yaml auto-discovers every
  # annotated Service in this namespace, so adding it here would scrape the
  # same ~10k series a second time under a second job name — double the
  # storage and two answers to every ratio query. monitoring.yaml declares an
  # explicit 'kube-state-metrics' job instead.
spec:
  type: ClusterIP
  ports:
  - name: http-metrics
    port: 8080
    targetPort: http-metrics
    protocol: TCP
  - name: telemetry
    port: 8081
    targetPort: telemetry
    protocol: TCP
  selector:
    app: kube-state-metrics
