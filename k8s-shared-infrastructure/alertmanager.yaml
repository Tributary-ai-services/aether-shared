apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-shared
  namespace: tas-shared
  labels:
    app: alertmanager-shared
    component: monitoring
spec:
  replicas: 1
  # Recreate, not RollingUpdate. Alertmanager writes its silences and nflog
  # snapshot on shutdown and reads it at startup. With maxSurge the replacement
  # pod starts while the old one is still running, so it loads the previous
  # (stale) snapshot and the old pod's save lands afterwards, unread -- silences
  # and notification-dedup state are lost on every restart. Observed directly:
  # a silence created before a rolling restart was gone after it, while the
  # snapshot file on disk had been written a few seconds too late to be read.
  #
  # One replica on a ReadWriteOnce volume cannot meaningfully roll anyway; the
  # cost is a few seconds without alerting during a restart.
  #
  # maxSurge: 0 rather than strategy: Recreate. Both stop the overlap, but
  # Recreate waits for EVERY pod matching the selector to disappear before
  # scaling up -- including pods stuck in a terminal phase. This deployment had
  # three Succeeded pods lingering from 2025, and switching to Recreate
  # deadlocked on them: all ReplicaSets sat at 0 while the deployment wanted 1,
  # and alertmanager stayed down until those pods were deleted. maxSurge: 0 with
  # maxUnavailable: 1 sequences the same way without that failure mode.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: alertmanager-shared
  template:
    metadata:
      labels:
        app: alertmanager-shared
        component: monitoring
    spec:
      # prom/alertmanager runs as uid 65534 (nobody), but this PVC was
      # provisioned root:root 0755, so alertmanager could not write its silences
      # or nflog snapshots -- "permission denied" continuously since the volume
      # was created in Dec 2025.
      #
      # fsGroup alone does NOT fix it here. This is a `local` PV backed by
      # /var/lib/rancher/k3s/storage on the node; setting fsGroup: 65534 and
      # restarting left the directory owned 0:0 and still unwritable, verified
      # by testing after the rollout. fsGroup is kept because it governs the
      # group of files the container creates from now on, but the existing
      # directory needs an explicit chown, which is what the init container does.
      #
      # Only this workload needs this. prometheus-shared runs as the same uid
      # with no fsGroup and works, because its directory happened to be created
      # owned by 65534; grafana, loki and redis each match their own runtime
      # user. Applying this fleet-wide would rewrite ownership on the loki,
      # minio and ollama volumes to fix nothing.
      securityContext:
        fsGroup: 65534
      initContainers:
      - name: fix-data-permissions
        image: busybox:1.36
        command: ['sh', '-c', 'chown -R 65534:65534 /alertmanager && chmod 0755 /alertmanager']
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: alertmanager-data
          mountPath: /alertmanager
      containers:
      - name: alertmanager
        image: prom/alertmanager:latest
        ports:
        - containerPort: 9093
          name: alertmanager
        args:
        - '--config.file=/etc/alertmanager/alertmanager.yml'
        - '--storage.path=/alertmanager'
        - '--web.external-url=http://localhost:9093'
        - '--cluster.listen-address=0.0.0.0:9094'
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        volumeMounts:
        - name: alertmanager-config
          mountPath: /etc/alertmanager
        - name: alertmanager-data
          mountPath: /alertmanager
        # The relay password is a Secret mounted as a file and referenced via
        # smtp_auth_password_file. The alertmanager config lives in a ConfigMap,
        # which is not a place for a credential.
        - name: alertmanager-smtp
          mountPath: /etc/alertmanager/smtp
          readOnly: true
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9093
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9093
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: alertmanager-config
        configMap:
          name: alertmanager-shared-config
      - name: alertmanager-data
        persistentVolumeClaim:
          claimName: alertmanager-shared-pvc
      - name: alertmanager-smtp
        secret:
          secretName: alertmanager-smtp

---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-shared
  namespace: tas-shared
  labels:
    app: alertmanager-shared
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9093"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - port: 9093
    targetPort: 9093
    protocol: TCP
    name: alertmanager
  selector:
    app: alertmanager-shared

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-shared-pvc
  namespace: tas-shared
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-shared-config
  namespace: tas-shared
data:
  alertmanager.yml: |
    global:
      # Same Brevo relay and sender the AIQG daily activity digest already
      # uses (aiqg-dashboard-be-config), so alerting rides a mail path that
      # is known to deliver rather than a second, untested one.
      smtp_smarthost: 'smtp-relay.brevo.com:587'
      smtp_from: 'aiqg@air-ops.net'
      smtp_auth_username: 'b571d7001@smtp-brevo.com'
      smtp_auth_password_file: '/etc/alertmanager/smtp/SMTP_PASSWORD'
      smtp_require_tls: true

    route:
      group_by: ['alertname']
      group_wait: 30s
      group_interval: 5m
      # 1h was fine for a receiver that discarded everything. Against a real
      # inbox it means a single unresolved alert mails you 24 times a day, and
      # an operator who filters the noise stops reading the signal.
      repeat_interval: 12h
      receiver: 'email-ops'

      routes:
      # Critical pages faster and repeats more often than the default.
      - matchers:
          - severity = "critical"
        receiver: 'email-ops'
        group_wait: 10s
        repeat_interval: 2h

    receivers:
    - name: 'email-ops'
      email_configs:
      - to: 'john@scharber.com'
        send_resolved: true
        headers:
          Subject: '[TAS {{ .Status | toUpper }}] {{ .GroupLabels.alertname }} ({{ .Alerts | len }})'
        # Plain text: an on-call engineer reads this on a phone, and the
        # annotations already carry the runbook pointer.
        text: |
          {{ .Status | toUpper }} — {{ .GroupLabels.alertname }}

          {{ range .Alerts }}
          Summary:  {{ .Annotations.summary }}
          Detail:   {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Service:  {{ .Labels.service }}{{ if .Labels.instance }}
          Instance: {{ .Labels.instance }}{{ end }}
          Started:  {{ .StartsAt }}
          {{ end }}

    # Slack notifications (uncomment and configure as needed)
    # - name: 'slack-notifications'
    #   slack_configs:
    #   - api_url: 'YOUR_SLACK_WEBHOOK_URL'
    #     channel: '#alerts'
    #     username: 'AlertManager'
    #     title: 'TAS Alert'
    #     text: 'Summary: {{ .CommonAnnotations.summary }}'

    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'dev', 'instance']