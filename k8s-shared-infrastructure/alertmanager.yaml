apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-shared
  namespace: tas-shared
  labels:
    app: alertmanager-shared
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager-shared
  template:
    metadata:
      labels:
        app: alertmanager-shared
        component: monitoring
    spec:
      containers:
      - name: alertmanager
        image: prom/alertmanager:latest
        ports:
        - containerPort: 9093
          name: alertmanager
        args:
        - '--config.file=/etc/alertmanager/alertmanager.yml'
        - '--storage.path=/alertmanager'
        - '--web.external-url=http://localhost:9093'
        - '--cluster.listen-address=0.0.0.0:9094'
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        volumeMounts:
        - name: alertmanager-config
          mountPath: /etc/alertmanager
        - name: alertmanager-data
          mountPath: /alertmanager
        # The relay password is a Secret mounted as a file and referenced via
        # smtp_auth_password_file. The alertmanager config lives in a ConfigMap,
        # which is not a place for a credential.
        - name: alertmanager-smtp
          mountPath: /etc/alertmanager/smtp
          readOnly: true
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9093
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9093
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: alertmanager-config
        configMap:
          name: alertmanager-shared-config
      - name: alertmanager-data
        persistentVolumeClaim:
          claimName: alertmanager-shared-pvc
      - name: alertmanager-smtp
        secret:
          secretName: alertmanager-smtp

---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-shared
  namespace: tas-shared
  labels:
    app: alertmanager-shared
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9093"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - port: 9093
    targetPort: 9093
    protocol: TCP
    name: alertmanager
  selector:
    app: alertmanager-shared

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-shared-pvc
  namespace: tas-shared
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-shared-config
  namespace: tas-shared
data:
  alertmanager.yml: |
    global:
      # Same Brevo relay and sender the AIQG daily activity digest already
      # uses (aiqg-dashboard-be-config), so alerting rides a mail path that
      # is known to deliver rather than a second, untested one.
      smtp_smarthost: 'smtp-relay.brevo.com:587'
      smtp_from: 'aiqg@air-ops.net'
      smtp_auth_username: 'b571d7001@smtp-brevo.com'
      smtp_auth_password_file: '/etc/alertmanager/smtp/SMTP_PASSWORD'
      smtp_require_tls: true

    route:
      group_by: ['alertname']
      group_wait: 30s
      group_interval: 5m
      # 1h was fine for a receiver that discarded everything. Against a real
      # inbox it means a single unresolved alert mails you 24 times a day, and
      # an operator who filters the noise stops reading the signal.
      repeat_interval: 12h
      receiver: 'email-ops'

      routes:
      # Critical pages faster and repeats more often than the default.
      - matchers:
          - severity = "critical"
        receiver: 'email-ops'
        group_wait: 10s
        repeat_interval: 2h

    receivers:
    - name: 'email-ops'
      email_configs:
      - to: 'john@scharber.com'
        send_resolved: true
        headers:
          Subject: '[TAS {{ .Status | toUpper }}] {{ .GroupLabels.alertname }} ({{ .Alerts | len }})'
        # Plain text: an on-call engineer reads this on a phone, and the
        # annotations already carry the runbook pointer.
        text: |
          {{ .Status | toUpper }} — {{ .GroupLabels.alertname }}

          {{ range .Alerts }}
          Summary:  {{ .Annotations.summary }}
          Detail:   {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Service:  {{ .Labels.service }}{{ if .Labels.instance }}
          Instance: {{ .Labels.instance }}{{ end }}
          Started:  {{ .StartsAt }}
          {{ end }}

    # Slack notifications (uncomment and configure as needed)
    # - name: 'slack-notifications'
    #   slack_configs:
    #   - api_url: 'YOUR_SLACK_WEBHOOK_URL'
    #     channel: '#alerts'
    #     username: 'AlertManager'
    #     title: 'TAS Alert'
    #     text: 'Summary: {{ .CommonAnnotations.summary }}'

    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'dev', 'instance']