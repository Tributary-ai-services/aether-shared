apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-semaphores
  namespace: argo
  labels:
    app: argo-workflows
    project: tas
data:
  # Limit concurrent workflow executions
  workflow: "10"
  # Limit concurrent LLM-calling steps (prevent rate limit exhaustion)
  llm: "5"
  # Limit concurrent document processing steps
  document-processing: "3"
  # Limit concurrent MCP tool calls
  mcp-tools: "5"
