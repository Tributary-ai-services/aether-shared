apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: document-processing
  namespace: argo-events
  labels:
    app: argo-events
    project: tas
    type: document-processing
spec:
  dependencies:
  - name: doc-processed
    eventSourceName: kafka
    eventName: document-processed
  - name: file-uploaded
    eventSourceName: minio
    eventName: file-upload
  triggers:
  # Notify aether-be when document processing completes
  - template:
      name: notify-doc-complete
      http:
        url: http://aether-backend.aether-be.svc.cluster.local:8080/api/v1/webhooks/document-processed
        method: POST
        headers:
          Content-Type: application/json
        payload:
        - src:
            dependencyName: doc-processed
            dataKey: body
          dest: document
    retryStrategy:
      steps: 3
      duration: 5s
  # Trigger processing workflow on new file upload
  - template:
      name: trigger-file-processing
      argoWorkflow:
        operation: submit
        source:
          resource:
            apiVersion: argoproj.io/v1alpha1
            kind: Workflow
            metadata:
              generateName: file-process-
              namespace: argo
            spec:
              entrypoint: process
              serviceAccountName: argo-workflow-runner
              arguments:
                parameters:
                - name: bucket
                - name: key
              templates:
              - name: process
                inputs:
                  parameters:
                  - name: bucket
                  - name: key
                container:
                  image: curlimages/curl:8.8.0
                  command: [sh, -c]
                  args:
                  - |
                    curl -sf -X POST \
                      "http://audimodal.aether-be.svc.cluster.local:8084/api/v1/process" \
                      -H 'Content-Type: application/json' \
                      -d '{"bucket":"{{inputs.parameters.bucket}}","key":"{{inputs.parameters.key}}"}'
        parameters:
        - src:
            dependencyName: file-uploaded
            dataKey: notification.0.s3.bucket.name
          dest: spec.arguments.parameters.0.value
        - src:
            dependencyName: file-uploaded
            dataKey: notification.0.s3.object.key
          dest: spec.arguments.parameters.1.value
    retryStrategy:
      steps: 3
      duration: 5s
