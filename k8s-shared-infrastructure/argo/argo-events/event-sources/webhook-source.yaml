apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: webhook
  namespace: argo-events
  labels:
    app: argo-events
    project: tas
    type: webhook
spec:
  service:
    ports:
    - port: 12000
      targetPort: 12000
  webhook:
    # Generic workflow trigger webhook
    workflow-trigger:
      port: "12000"
      endpoint: /workflow-trigger
      method: POST
    # GitHub webhook for repository events
    github-events:
      port: "12000"
      endpoint: /github
      method: POST
    # TAS API callback webhook
    tas-api-callback:
      port: "12000"
      endpoint: /tas-callback
      method: POST
