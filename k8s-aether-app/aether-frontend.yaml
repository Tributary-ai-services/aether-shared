apiVersion: v1
kind: ConfigMap
metadata:
  name: aether-frontend-config
  namespace: aether-be
data:
  VITE_AETHER_API_BASE: "https://aether-api.tas.scharber.com"
  VITE_AETHER_API_URL: "https://aether-api.tas.scharber.com/api/v1"
  VITE_AGENT_BUILDER_API_URL: "http://agent-builder:3000/api/v1"
  VITE_KEYCLOAK_URL: "https://keycloak.tas.scharber.com"
  VITE_KEYCLOAK_REALM: "aether"
  VITE_KEYCLOAK_CLIENT_ID: "aether-frontend"
  VITE_DEV_MODE: "true"
  VITE_AUDIMODAL_API_URL: "http://audimodal:8080/api/v1"
  VITE_DEEPLAKE_API_URL: "http://deeplake-api:8000/api/v1"
---
apiVersion: v1
kind: Secret
metadata:
  name: aether-frontend-dev-credentials
  namespace: aether-be
type: Opaque
stringData:
  VITE_DEV_USERNAME: "john@scharber.com"
  VITE_DEV_PASSWORD: "test123"
  VITE_AUDIMODAL_API_KEY: "your-audimodal-api-key"
  VITE_AUDIMODAL_TENANT_ID: "your-audimodal-tenant-id"
  VITE_DEEPLAKE_API_KEY: "your-deeplake-api-key"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aether-frontend
  namespace: aether-be
  labels:
    app: aether-frontend
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aether-frontend
  template:
    metadata:
      labels:
        app: aether-frontend
        component: frontend
    spec:
      # Spread replicas across nodes (cluster gained pinova01 2026-09-21).
      # topologySpreadConstraints, not podAntiAffinity: a `preferred`
      # anti-affinity was measured putting both replicas on the SAME node,
      # because each replacement is scheduled while the pod it replaces still
      # counts. A rollout alone may still co-locate them -- check placement
      # and delete one pod to rebalance.
      #
      # ScheduleAnyway, not DoNotSchedule: with two nodes a hard constraint
      # leaves a replica Pending whenever one node is down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: aether-frontend
      containers:
      - name: aether-frontend
        # Pinned to what runs (Plan #22 W0.0 match-live, 2026-11-20). This said
        # :latest while production ran dup-agent-fix-20260619, then 1.1.0
        # (aether#24, AB-13), built with VITE_AETHER_API_URL=/api/v1,
        # VITE_KEYCLOAK_URL=https://keycloak.tas.scharber.com,
        # VITE_KEYCLOAK_REALM=aether, VITE_KEYCLOAK_CLIENT_ID=aether-frontend,
        # VITE_DEV_MODE=false (tas.config.sha256 6ab11b64...).
        image: registry-api.tas.scharber.com/aether-frontend:1.1.0@sha256:44747dcb02a944b8700fc256e439ed15bab016f755b2d6373541ab5fc9a37ba0
        imagePullPolicy: Always  # Pull from registry
        ports:
        - containerPort: 80
          name: http
        env:
        # Load config from ConfigMap
        - name: VITE_AETHER_API_BASE
          valueFrom:
            configMapKeyRef:
              name: aether-frontend-config
              key: VITE_AETHER_API_BASE
        - name: VITE_AETHER_API_URL
          valueFrom:
            configMapKeyRef:
              name: aether-frontend-config
              key: VITE_AETHER_API_URL
        - name: VITE_AGENT_BUILDER_API_URL
          valueFrom:
            configMapKeyRef:
              name: aether-frontend-config
              key: VITE_AGENT_BUILDER_API_URL
        - name: VITE_KEYCLOAK_URL
          valueFrom:
            configMapKeyRef:
              name: aether-frontend-config
              key: VITE_KEYCLOAK_URL
        - name: VITE_KEYCLOAK_REALM
          valueFrom:
            configMapKeyRef:
              name: aether-frontend-config
              key: VITE_KEYCLOAK_REALM
        - name: VITE_KEYCLOAK_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: aether-frontend-config
              key: VITE_KEYCLOAK_CLIENT_ID
        - name: VITE_DEV_MODE
          valueFrom:
            configMapKeyRef:
              name: aether-frontend-config
              key: VITE_DEV_MODE
        - name: VITE_AUDIMODAL_API_URL
          valueFrom:
            configMapKeyRef:
              name: aether-frontend-config
              key: VITE_AUDIMODAL_API_URL
        - name: VITE_DEEPLAKE_API_URL
          valueFrom:
            configMapKeyRef:
              name: aether-frontend-config
              key: VITE_DEEPLAKE_API_URL
        # Load secrets from Secret
        - name: VITE_DEV_USERNAME
          valueFrom:
            secretKeyRef:
              name: aether-frontend-dev-credentials
              key: VITE_DEV_USERNAME
        - name: VITE_DEV_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aether-frontend-dev-credentials
              key: VITE_DEV_PASSWORD
        - name: VITE_AUDIMODAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: aether-frontend-dev-credentials
              key: VITE_AUDIMODAL_API_KEY
        - name: VITE_AUDIMODAL_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: aether-frontend-dev-credentials
              key: VITE_AUDIMODAL_TENANT_ID
        - name: VITE_DEEPLAKE_API_KEY
          valueFrom:
            secretKeyRef:
              name: aether-frontend-dev-credentials
              key: VITE_DEEPLAKE_API_KEY
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: aether-frontend
  namespace: aether-be
  labels:
    app: aether-frontend
    component: frontend
spec:
  selector:
    app: aether-frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  type: ClusterIP
---
# Optional: NodePort service for local development access
apiVersion: v1
kind: Service
metadata:
  name: aether-frontend-nodeport
  namespace: aether-be
  labels:
    app: aether-frontend
    component: frontend
spec:
  selector:
    app: aether-frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30001
    protocol: TCP
  type: NodePort
---
# Aether Frontend Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aether-frontend-ingress
  namespace: aether-be
  annotations:
    # No rewrite-target: live has none, and with the /api path below it would
    # strip the prefix the backend routes on. The CORS, body-size and timeout
    # annotations were patched onto the live object by hand; carried here so
    # applying this file changes nothing (match-live, 2026-11-20).
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://aether.tas.scharber.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Space-ID,X-Space-Type,X-Tenant-ID"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # Internal CA — public DNS for *.tas.scharber.com points at a private LB IP,
    # so Let's Encrypt HTTP-01 can't validate. Matches every other TAS service.
    cert-manager.io/cluster-issuer: "tas-ca-issuer"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Increase proxy buffer size for React app
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    # Enable websocket support for hot reload in dev mode
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-set-headers: "Connection keep-alive"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - aether.tas.scharber.com
    secretName: aether-frontend-tls
  rules:
  - host: aether.tas.scharber.com
    http:
      paths:
      # The SPA calls the backend same-origin at /api (VITE_AETHER_API_URL=/api/v1).
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: aether-backend
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aether-frontend
            port:
              number: 80